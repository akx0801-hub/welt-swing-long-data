name: P0 Frozen 1425 Feature Materialization Capability v0.54

on:
  push:
    branches: [main]
    paths:
      - scripts/p0_frozen_1425_feature_materialization_v0_54.py
      - tests/test_p0_frozen_1425_feature_materialization_v0_54.py
      - .github/workflows/p0_frozen_1425_feature_materialization_v0.54.yml

permissions:
  contents: read
  actions: read

jobs:
  materialize-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bounded implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded offline dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pandas==2.2.3" "numpy==2.1.3" "pytest==8.3.5"

      - name: Verify required start lineage and exact v0.53 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8106f8d7a348b4000b504da6b9a82d9fd1db1c33 HEAD
          DIGEST="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10900287789 --jq .digest)"
          test "$DIGEST" = "sha256:f54f1520e6cfcefbca043bc782ccf71ddd0e70538722ee1c3857551396761e95"
          rm -rf runtime_input/v053
          mkdir -p runtime_input/v053
          gh run download 36225840648 --repo "$GITHUB_REPOSITORY" \
            --name p0-frozen-1425-filtered-invalid-bar-policy-v0.53-36225840648 \
            --dir runtime_input/v053
          test -f runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite
          test "$(sha256sum runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite | awk '{print $1}')" = "bccca4f168eb5fbd68822d5ebd96419066c69400014b8525a0bec60df0b07afc"
          test "$(stat -c %s runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite)" = "144539648"

      - name: Focused v0.54 implementation tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/p0_frozen_1425_feature_materialization_v0_54.py
          pytest -q tests/test_p0_frozen_1425_feature_materialization_v0_54.py

      - name: Materialize exact Frozen-1425 current-canonical local features
        run: |
          set -euo pipefail
          rm -rf output_p0_frozen_1425_features_v0_54
          python scripts/p0_frozen_1425_feature_materialization_v0_54.py \
            --source-sqlite runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite \
            --output-dir output_p0_frozen_1425_features_v0_54 \
            --repository-sha "$GITHUB_SHA"

      - name: Validate bounded result
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          out=Path("output_p0_frozen_1425_features_v0_54")
          s=json.load(open(out/"summary_preupload_v0.54.json",encoding="utf-8"))
          c=json.load(open(out/"stage_checkpoint_preupload_v0.54.json",encoding="utf-8"))
          d=json.load(open(out/"determinism_v0.54.json",encoding="utf-8"))
          i=json.load(open(out/"price_runtime_immutability_v0.54.json",encoding="utf-8"))
          feat=list(csv.DictReader(open(out/"feature_materialization_v0.54.csv",encoding="utf-8")))
          cap=list(csv.DictReader(open(out/"feature_capability_v0.54.csv",encoding="utf-8")))
          inv=list(csv.DictReader(open(out/"feature_inventory_v0.54.csv",encoding="utf-8")))
          asx=list(csv.DictReader(open(out/"asx8_feature_regression_v0.54.csv",encoding="utf-8")))
          tests=list(csv.DictReader(open(out/"test_results_v0.54.csv",encoding="utf-8")))
          assert s["status"]=="PASS_WITH_LOCAL_FEATURE_MODEL_GAPS"
          assert len(feat)==1425 and len(cap)==1425
          assert len({r["Security_Key"] for r in feat})==1425
          assert len({r["Source_WS_ID"] for r in feat})==1425
          assert s["capability_counts"]=={
              "FEATURE_READY":0,
              "FEATURE_PARTIAL":1425,
              "FEATURE_BLOCKED_INSUFFICIENT_HISTORY":0,
              "FEATURE_BLOCKED_INPUT":0,
              "FEATURE_COMPUTATION_ERROR":0,
              "NOT_VERIFIED":0,
          }
          assert s["p0_local_feature_layer_ready"] is False
          assert len([r for r in inv if r["status"]=="CANONICAL_IMPLEMENTED"])==21
          assert d["semantic_digest_match"] is True
          assert i["sqlite_sha256_unchanged"] is True
          assert i["price_daily_digest_unchanged"] is True
          assert i["provider_mapping_digest_unchanged"] is True
          assert i["cache_state_counts_unchanged"] is True
          assert len(asx)==8 and all(r["regression_result"]=="PASS" for r in asx)
          assert all(r["Result"]=="PASS" for r in tests)
          assert c["tests_failed"]==0
          assert s["home_market_rs_ready"] is False and s["sector_rs_ready"] is False
          assert s["p0_runs"]==0
          assert s["market_provider_calls"]==0 and s["yahoo_yfinance_calls"]==0 and s["eodhd_calls"]==0
          assert s["alpha_vantage_calls"]==0 and s["scalable_calls"]==0
          assert hashlib.sha256(Path("universe/SWING_U3K_FROZEN_v0.5.csv").read_bytes()).hexdigest()=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          print(json.dumps({"status":s["status"],"capability_counts":s["capability_counts"],"semantic_sha256":s["materialization"]["semantic_sha256"],"tests":s["tests"]},sort_keys=True))
          PY
          test "$(sha256sum runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite | awk '{print $1}')" = "bccca4f168eb5fbd68822d5ebd96419066c69400014b8525a0bec60df0b07afc"
          test "$(git diff -- universe/SWING_U3K_FROZEN_v0.5.csv)" = ""
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Upload bounded v0.54 feature evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-frozen-1425-feature-materialization-v0.54-${{ github.run_id }}
          path: output_p0_frozen_1425_features_v0_54/
          if-no-files-found: error
          retention-days: 14
