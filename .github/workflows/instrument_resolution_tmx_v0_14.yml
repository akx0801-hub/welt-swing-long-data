name: Welt-Swing Instrument Resolution TMX v0.14
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/instrument_resolution_tmx_v0.14.json'
permissions:
  contents: write
jobs:
  resolve_tmx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests pypdf
      - name: Offline-Selbsttest
        run: python scripts/classify_instruments_tmx_v0_14.py --self-test
      - name: Frozen-v0.13-Input-Gates
        run: |
          test "$(git hash-object output_instrument_resolution_v0_13/summary_v0.13.json)" = "85c8f3bcf2855488a3133862002ac4e58d3fd7ba"
          test "$(git hash-object output_instrument_resolution_v0_13/instrument_manual_review_queue_v0.13.csv)" = "e9d9983ca00e0f4b30b8d519e17268641a0d0004"
          test "$(git hash-object output_instrument_resolution_v0_13/ca_target_tmx_presence_v0.13.csv)" = "bb3b8a40d7e522255279ccaffd35e04a02334716"
          test "$(git hash-object output_instrument_resolution_v0_12/eligibility_after_instrument_v0.12.csv)" = "a909953a5c20cb1eb440eaa76199c062034a562a"
      - name: TMX Instrumente klassifizieren
        run: python scripts/classify_instruments_tmx_v0_14.py --config config/instrument_resolution_tmx_v0.14.json
      - name: Ergebnis-Gates
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          x=json.loads(Path('output_instrument_resolution_v0_14/summary_v0.14.json').read_text())
          assert x['schema']=='WELT_SWING_INSTRUMENT_RESOLUTION_TMX_V0_14'
          assert x['tmx_pass_rows']+x['tmx_fail_rows']+x['tmx_unresolved_rows']==105
          assert x['remaining_manual_rows_v0_14']==650-x['tmx_pass_rows']-x['tmx_fail_rows']
          assert x['strict_candidates_v0_14']==2037+x['tmx_pass_rows']
          assert x['strict_freeze_allowed'] is False and x['p0_run'] is False
          assert x['alpha_vantage_allowed'] is False and x['web_calls_per_security'] is False
          q=pd.read_csv('output_instrument_resolution_v0_14/instrument_manual_review_queue_v0.14.csv')
          s=pd.read_csv('output_instrument_resolution_v0_14/strict_u3k_candidate_after_instrument_v0.14.csv')
          assert len(q)==x['remaining_manual_rows_v0_14'] and len(s)==x['strict_candidates_v0_14']
          print('INSTRUMENT_RESOLUTION_TMX_V0_14_RESULT_GATES_PASS')
          PY
      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_instrument_resolution_v0_14/
          if git diff --cached --quiet; then echo "Keine Änderungen."; else git commit -m "Resolve TMX composite instruments v0.14" && git push; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-instrument-resolution-tmx-v0.14-${{ github.run_number }}
          path: output_instrument_resolution_v0_14/
          retention-days: 14
