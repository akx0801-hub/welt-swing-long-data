name: Current Master Research Partial 1633 Baseline v0.37
on:
  push:
    branches: [main]
    paths:
      - 'config/current_master_research_partial_1633_eligibility_baseline_refresh_plan_v0.37.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
            - name: Restore full v0.37 baseline script and additive counts
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="scripts/current_master_research_partial_1633_eligibility_baseline_refresh_plan_v0_37.py"
          BASE="b308232c7d0b2cec9cf09aeab7eca78376014468"
          EXPECTED_BLOB="7044238cc288f8576b1ef3b7da279651ada70a92"
          git show "${BASE}:${SCRIPT}" > /tmp/v0_37_b308.py
          test "$(git hash-object /tmp/v0_37_b308.py)" = "${EXPECTED_BLOB}"
          cp /tmp/v0_37_b308.py "${SCRIPT}"
          python - "${SCRIPT}" <<'PY2'
          import sys
          p=sys.argv[1]; t=open(p,encoding="utf-8").read()
          summary_anchor='    summary={'
          if t.count(summary_anchor)!=1: raise SystemExit("summary anchor count != 1")
          addition=('    count_rows("identity_baseline_counts_v0.37.csv","Identity_Baseline_State",ledger)\n'
                    '    count_rows("instrument_baseline_counts_v0.37.csv","Instrument_Gate_Baseline_State",ledger)\n'
                    '    count_rows("refresh_action_counts_v0.37.csv","Planned_Next_Action",ledger)\n')
          t=t.replace(summary_anchor,addition+summary_anchor,1)
          old='"counts":{"mapping":dict(Counter(r["Mapping_Baseline_State"] for r in ledger)),'
          new=('"counts":{'
               '"identity":dict(Counter(r["Identity_Baseline_State"] for r in ledger)),'
               '"instrument":dict(Counter(r["Instrument_Gate_Baseline_State"] for r in ledger)),'
               '"mapping":dict(Counter(r["Mapping_Baseline_State"] for r in ledger)),')
          if t.count(old)!=1: raise SystemExit("summary counts anchor count != 1")
          t=t.replace(old,new,1)
          if t.count("from __future__ import annotations")!=1 or t.count("def main(")!=1 or t.count("if __name__")!=1: raise SystemExit("structure gate failed")
          open(p,"w",encoding="utf-8").write(t)
          PY2
          python -m py_compile "${SCRIPT}"
          python "${SCRIPT}" --self-test
          python - "${SCRIPT}" <<'PY2'
          import subprocess,sys
          a,d,_=subprocess.check_output(["git","diff","--numstat","b308232c7d0b2cec9cf09aeab7eca78376014468","--",sys.argv[1]],text=True).strip().split("\t")
          if int(a)>4 or int(d)>1: raise SystemExit(f"non-minimal diff +{a} -{d}")
          PY2
      - name: py_compile
        run: python -m py_compile scripts/current_master_research_partial_1633_eligibility_baseline_refresh_plan_v0_37.py
      - name: Self-Test
        run: python scripts/current_master_research_partial_1633_eligibility_baseline_refresh_plan_v0_37.py --self-test
      - name: Immutable input gates
        run: |
          for p in universe/Welt-Swing-Universe-Master-v2.0.xlsx universe/research_partial_1633.csv universe/research_partial_1633_manifest.json WELT-SWING-CURRENT-Handoff-v0.36.md; do git rev-parse HEAD:"$p"; done
      - name: Evidence Inventory and Baseline Reconciliation
        run: python scripts/current_master_research_partial_1633_eligibility_baseline_refresh_plan_v0_37.py
      - name: Strong Result Gates
        run: |
          set -euo pipefail
          OUT=output_current_master_research_partial_1633_baseline_v0_37
          test "$(($(wc -l < "$OUT/eligibility_baseline_1633_v0.37.csv")-1))" = 1633
          test "$(($(wc -l < "$OUT/data_refresh_plan_1633_v0.37.csv")-1))" = 1633
          test "$(($(wc -l < "$OUT/data_refresh_batch_plan_v0.37.csv")-1))" -gt 1
          test "$(($(wc -l < "$OUT/eligibility_recompute_plan_v0.37.csv")-1))" = 8
          test "$(($(wc -l < "$OUT/baseline_evidence_lineage_v0.37.csv")-1))" -ge 6
          test "$(($(wc -l < "$OUT/historical_eligibility_evidence_inventory_v0.37.csv")-1))" -gt 5
          for f in identity_baseline_counts instrument_baseline_counts mapping_baseline_counts history_baseline_counts liquidity_baseline_counts scalable_baseline_counts prior_eligibility_counts refresh_action_counts; do test -f "$OUT/$f"_v0.37.csv; done
          cmp -s WELT-SWING-CURRENT-Handoff-v0.37.md WELT-SWING-CURRENT-Handoff-CURRENT.md
          python - <<'PY'
          import csv,json
          o="output_current_master_research_partial_1633_baseline_v0_37"; r=list(csv.DictReader(open(f"{o}/eligibility_baseline_1633_v0.37.csv",encoding="utf-8")))
          assert len({x["WS_ID"] for x in r})==1633
          assert not any(x["Productive_Eligibility"]=="true" or x["SWING_U3K_FROZEN_Member"]=="true" for x in r)
          br=[x for x in r if x["Primary_Universe_Index"]=="BR_IBRX100"]; assert len(br)==98
          want={"STANDARD_ELIGIBILITY_READY":38,"LOW_LIQUIDITY_EXCEPTION_POOL":28,"STANDARD_U3K_NOT_ELIGIBLE_LIQUIDITY":13,"STANDARD_U3K_NOT_ELIGIBLE_INSTRUMENT":19}
          assert {k:sum(x["Prior_Eligibility_State"]==k for x in br) for k in want}==want
          s=json.load(open(f"{o}/summary_v0.37.json",encoding="utf-8"))
          assert not s["data_refresh_executed_v0_37"] and not s["productive"] and not s["p0"] and not s["swing_u3k_frozen"] and not s["full_scan_allowed"]
          PY
      - name: Commit outputs and restored script
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/current_master_research_partial_1633_eligibility_baseline_refresh_plan_v0_37.py output_current_master_research_partial_1633_baseline_v0_37 WELT-SWING-CURRENT-Handoff-v0.37.md WELT-SWING-CURRENT-Handoff-CURRENT.md
          git diff --cached --quiet || git commit -m "v0.37 restore full baseline logic and finalize counts"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: v0.37-baseline
          path: output_current_master_research_partial_1633_baseline_v0_37
