name: Welt-Swing Non-READY Remediation v0.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'openpyxl>=3.1,<4'

      - name: Schutzregel - kein Price/History Download
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path('scripts/non_ready_remediation_v0_2.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          forbidden = []
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              fn = node.func
              if isinstance(fn, ast.Attribute) and fn.attr in {
                  'download', 'history', 'get_history_metadata'
              }:
                  forbidden.append((fn.attr, getattr(node, 'lineno', None)))
          if forbidden:
              raise SystemExit(f'Forbidden price/history calls found: {forbidden}')
          print('NON_READY_REMEDIATION_NO_PRICE_HISTORY_CALLS_OK')
          PY

      - name: Offline-Selbsttest
        run: python scripts/non_ready_remediation_v0_2.py --self-test

      - name: Input-Gates
        run: |
          test -f universe/Welt-Swing-Universe-Master-EvidenceFrozen-v0.7.csv
          test -f output_non_ready_diagnostic/non_ready_diagnostic_rows_v0.1.csv
          test -f output_non_ready_diagnostic/suspicious_return_events_v0.1.csv
          test -f output_full_3663/features_latest.csv
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv(
              'universe/Welt-Swing-Universe-Master-EvidenceFrozen-v0.7.csv',
              keep_default_na=False, dtype=str
          )
          d = pd.read_csv(
              'output_non_ready_diagnostic/non_ready_diagnostic_rows_v0.1.csv',
              keep_default_na=False, dtype=str
          )
          f = pd.read_csv('output_full_3663/features_latest.csv')
          assert len(m) == 3664
          assert m['Active'].astype(str).str.lower().eq('true').sum() == 3663
          assert len(d) == 85
          assert len(f) == 3578
          assert (d['Diagnostic_Classification'] == 'LIKELY_ISOLATED_INVALID_BARS_FILTERABLE').sum() == 23
          c = set(m.loc[m['WS_ID'].isin(['WS:US:CWEN','WS:US:CWEN.A']), 'WS_ID'])
          assert c == {'WS:US:CWEN','WS:US:CWEN.A'}
          print('NON_READY_REMEDIATION_INPUT_GATE_PASS')
          PY

      - name: Full-3663 SQLite Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: runtime_cache/full_3663_prices.sqlite
          key: full-3663-price-${{ runner.os }}-remediation-${{ github.run_id }}
          restore-keys: |
            full-3663-price-${{ runner.os }}-

      - name: SQLite-Restore prüfen
        run: |
          test -f runtime_cache/full_3663_prices.sqlite
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect('runtime_cache/full_3663_prices.sqlite')
          try:
              n = con.execute('SELECT COUNT(*) FROM price_daily').fetchone()[0]
              s = con.execute('SELECT COUNT(*) FROM cache_state').fetchone()[0]
          finally:
              con.close()
          print('RESTORED_PRICE_ROWS', n)
          print('RESTORED_STATES', s)
          assert n >= 1800000
          assert s == 3663
          PY

      - name: Remediation v0.2 ausführen
        run: |
          python scripts/non_ready_remediation_v0_2.py \
            --config config/non_ready_remediation_v0.2.json

      - name: Ergebnis-Gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(
              Path('output_non_ready_remediation/summary_v0.2.json')
              .read_text(encoding='utf-8')
          )

          print('RUN_STATUS', x['run_status'])
          print('ACTIVE_AFTER', x['active_rows_after_evidence_remediation'])
          print('EXCLUSIONS', x['delisted_or_retired_exclusions'])
          print('REMAPS', x['provider_or_successor_remaps'])
          print('QA_CANDIDATES', x['filterable_invalid_bar_candidates'])
          print('SHADOW_FILTERED_READY', x['shadow_filtered_ready_candidates'])
          print('EFFECTIVE_READY_SHADOW', x['effective_ready_shadow_if_qa_policy_approved'])
          print('EFFECTIVE_READY_PCT', x['effective_ready_shadow_pct_of_active_after_remediation'])
          print('REFRESH_QUEUE', x['targeted_refresh_queue_rows'])
          print('EVENT_CLASSES', x['event_classification_counts'])

          assert x['run_status'] == 'NON_READY_REMEDIATION_V0_2_COMPLETE'
          assert x['source_master_rows'] == 3664
          assert x['source_active_rows'] == 3663
          assert x['active_rows_after_evidence_remediation'] == 3657
          assert x['delisted_or_retired_exclusions'] == 6
          assert x['provider_or_successor_remaps'] == 4
          assert x['current_symbol_refresh_only'] == 1
          assert x['filterable_invalid_bar_candidates'] == 23
          assert x['shadow_filtered_ready_candidates'] == 20
          assert x['effective_ready_shadow_if_qa_policy_approved'] == 3598
          assert x['effective_feature_rows_shadow'] == 3598
          assert x['targeted_refresh_queue_rows'] == 6
          assert x['provider_symbol_duplicates_after_remediation'] == 0
          assert x['automatic_cache_status_promotions'] == 0
          assert x['price_downloads_performed'] is False
          assert x['p0_run'] is False
          assert x['productive_trading_authority'] is False
          assert x['alpha_vantage_allowed'] is False
          print('NON_READY_REMEDIATION_GATES_PASS')
          PY

      - name: Ergebnisse committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe/Welt-Swing-Universe-Master-RemediatedData-v0.8.csv \
                  universe/Welt-Swing-Universe-Master-RemediatedData-v0.8.xlsx \
                  output_non_ready_remediation/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Remediate non-ready data cases v0.2"
            git push
          fi

      - name: Remediation-Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-non-ready-remediation-v0.2-${{ github.run_number }}
          path: |
            universe/Welt-Swing-Universe-Master-RemediatedData-v0.8.csv
            universe/Welt-Swing-Universe-Master-RemediatedData-v0.8.xlsx
            output_non_ready_remediation/
          retention-days: 14
