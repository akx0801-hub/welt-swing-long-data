name: G-P0-10 v1.08 holdout execution
on:
  push:
    branches: [dev/g-p0-10-v1.08]
  workflow_dispatch:
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: akx0801-hub/welt-swing-long-data
          run-id: 36225840648
          artifact-ids: 10900287789
          path: v053
      - name: Install execution dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Verify governed inputs
        run: |
          sha256sum $(find v053 -name p0_frozen_1425_v0_53.sqlite -print -quit)
          test "$(sha256sum $(find v053 -name p0_frozen_1425_v0_53.sqlite -print -quit) | cut -d' ' -f1)" = "bccca4f168eb5fbd68822d5ebd96419066c69400014b8525a0bec60df0b07afc"
          test "$(sha256sum universe/SWING_U3K_FROZEN_v0.5.csv | cut -d' ' -f1)" = "54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
      - name: Execute frozen C07 holdout
        run: |
          mkdir holdout payload
          python scripts/g_p0_10_holdout_execution_v108.py $(find v053 -name p0_frozen_1425_v0_53.sqlite -print -quit) universe/SWING_U3K_FROZEN_v0.5.csv holdout | tee holdout/execution_stdout.json
          cp holdout/holdout_anchor_evidence_v1.08.csv payload/
          cp holdout/holdout_payload_manifest_v1.08.json payload/
          test "$(($(wc -l < payload/holdout_anchor_evidence_v1.08.csv)-1))" = "66148"
          test "$(find payload -maxdepth 1 -type f | wc -l)" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: WELT-SWING_L1_BREAKOUT_VCP_HOLDOUT_v1.08_Payload
          path: payload/
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: g-p0-10-v1.08-holdout-aggregate-prepersist
          path: |
            holdout/finalist_execution_counts_v1.08.csv
            holdout/finalist_component_counts_v1.08.csv
            holdout/finalist_forward_continuous_summary_v1.08.csv
            holdout/finalist_forward_boolean_summary_v1.08.csv
            holdout/finalist_primary_mic_stability_v1.08.csv
            holdout/finalist_month_stability_v1.08.csv
            holdout/execution_stdout.json
