name: Welt-Swing Identity Final Remediation v0.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final_remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'openpyxl>=3.1,<4'

      - name: Schutzregel - kein Preis-/History-Lauf
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('scripts/identity_provider_final_remediation_v0_3.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          forbidden = []
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              fn = node.func
              if isinstance(fn, ast.Attribute) and fn.attr in {
                  'download', 'history', 'get_history_metadata'
              }:
                  forbidden.append((fn.attr, getattr(node, 'lineno', None)))
          if forbidden:
              raise SystemExit(f'Forbidden price/history calls found: {forbidden}')
          print('NO_PRICE_HISTORY_CALLS_OK')
          PY

      - name: Offline-Selbsttest und 121er Coverage-Gate
        run: python scripts/identity_provider_final_remediation_v0_3.py --self-test

      - name: v0.2 Eingaben prüfen
        run: |
          test -f universe/Welt-Swing-Universe-Master-Remediated-v0.5.csv
          test -f output_identity_remediation/review_queue_v0.2.csv
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv(
              'universe/Welt-Swing-Universe-Master-Remediated-v0.5.csv',
              keep_default_na=False, dtype=str
          )
          q = pd.read_csv(
              'output_identity_remediation/review_queue_v0.2.csv',
              keep_default_na=False, dtype=str
          )
          assert len(m) == 3664, len(m)
          assert len(q) == 121, len(q)
          assert not m['WS_ID'].duplicated().any()
          active = m['Active'].astype(str).str.lower()
          assert active.isin({'true','false'}).all(), sorted(active.unique())
          print('V02_INPUTS_OK rows=3664 review=121')
          PY

      - name: Final-Search-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: runtime_cache/identity_final_remediation_search_v0.3.jsonl
          key: identity-final-v03-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            identity-final-v03-${{ runner.os }}-

      - name: Final Remediation v0.3
        run: |
          python scripts/identity_provider_final_remediation_v0_3.py \
            --config config/identity_provider_final_remediation_v0.3.json

      - name: Final-Gates prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output_identity_final/summary_v0.3.json')
          x = json.loads(p.read_text(encoding='utf-8'))

          print('RUN_STATUS', x['run_status'])
          print('TARGET_INPUT', x['target_review_input_rows'])
          print('TARGET_RESOLVED', x['target_resolved_provider_rows'])
          print('TARGET_STALE_EXCLUDED', x['target_stale_excluded_rows'])
          print('TARGET_UNRESOLVED', x['target_unresolved_rows'])
          print('ACTIVE_MAPPING', x['active_provider_mapped'], '/', x['active_rows'],
                x['active_provider_mapping_pct'])
          print('COVERAGE_READY', x['price_run_candidate_coverage_ready'])
          print('SEARCH_QUERIES', x['new_search_queries_used'])

          assert x['master_rows'] == 3664
          assert x['target_review_input_rows'] == 121
          assert (
              x['target_resolved_provider_rows']
              + x['target_stale_excluded_rows']
              + x['target_unresolved_rows']
          ) == 121
          assert x['productive_trading_authority'] is False
          assert x['p0_run'] is False
          assert x['alpha_vantage_allowed'] is False
          assert x['price_run_allowed_after_this_step'] is False
          assert x['run_status'] in {
              'FINAL_REMEDIATION_COMPLETE',
              'FINAL_REMEDIATION_COMPLETE_WITH_REVIEW_QUEUE',
          }
          PY

      - name: Ergebnisse committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe/Welt-Swing-Universe-Master-FinalMapped-v0.6.csv \
                  universe/Welt-Swing-Universe-Master-FinalMapped-v0.6.xlsx \
                  output_identity_final/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Run identity final remediation v0.3"
            git push
          fi

      - name: Final-Remediation-Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-identity-final-remediation-v03-${{ github.run_number }}
          path: |
            universe/Welt-Swing-Universe-Master-FinalMapped-v0.6.csv
            universe/Welt-Swing-Universe-Master-FinalMapped-v0.6.xlsx
            output_identity_final/
            runtime_cache/identity_final_remediation_search_v0.3.jsonl
          retention-days: 14
