name: Welt-Swing Data Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Starterpaket beim ersten Lauf entpacken
        shell: bash
        run: |
          if [ -f welt-swing-long-github-starter-v0.1.zip ]; then
            unzip -o welt-swing-long-github-starter-v0.1.zip -d .
            rm -f welt-swing-long-github-starter-v0.1.zip
          fi
          test -f requirements.txt
          test -f scripts/run_update.py
          test -f config/run_config.json

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline-Selbsttest
        run: python scripts/self_test.py

      - name: Letzten Price Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: runtime_cache
          key: market-price-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-price-${{ runner.os }}-

      - name: yfinance-Datenlauf starten
        run: python scripts/run_update.py --config config/run_config.json

      - name: Öffentliche Ergebnisdateien speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Update Welt-Swing free market data"
            git push
          fi

      - name: Ergebnisse zusätzlich als Action-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-output-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Laufstatus prüfen
        run: python scripts/assert_run_status.py output/coverage.json

