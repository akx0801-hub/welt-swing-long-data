name: P0 Frozen 1425 Home Market RS v0.58

on:
  push:
    branches: [main]
    paths:
      - scripts/p0_frozen_1425_home_market_rs_materialization_v0_58.py
      - scripts/persist_p0_frozen_1425_home_market_rs_v0_58.py
      - tests/test_p0_frozen_1425_home_market_rs_v0_58.py
      - .github/workflows/p0_frozen_1425_home_market_rs_v0.58.yml

permissions:
  contents: write
  actions: read

jobs:
  home-market-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bounded v0.58 implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pandas==2.2.3" "numpy==2.1.3" "pytest==8.3.5"

      - name: Verify v0.57 authority and exact read-only price runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 80d80eee5e8a2e6ddad5f7b7b1231b9a3da21895 HEAD

          D57="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10905448132 --jq .digest)"
          test "$D57" = "sha256:7f35e18264110c6a6a84205ab443a7b1c3cabcbaebdb3e6d6af79df6361e1c00"

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open("output_p0_frozen_1425_local_feature_implementation_v0_57/summary_v0.57.json",encoding="utf-8"))
          assert s["status"]=="PASS_LOCAL_FEATURE_LAYER_READY"
          assert s["p0_local_feature_layer_ready"] is True
          assert s["capability_counts"]["FEATURE_READY"]==1425
          assert s["features"]["total_numeric"]==34
          assert s["feature_artifact"]["workflow_run_id"]==36239952535
          assert s["feature_artifact"]["artifact_id"]==10905448132
          assert s["feature_artifact"]["artifact_digest"]=="sha256:7f35e18264110c6a6a84205ab443a7b1c3cabcbaebdb3e6d6af79df6361e1c00"
          assert s["full_frozen_materialization"]["semantic_sha256"]=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert s["frozen"]["members"]==1425
          assert s["frozen"]["sha256"]=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert s["price_runtime"]["sha256"]=="bccca4f168eb5fbd68822d5ebd96419066c69400014b8525a0bec60df0b07afc"
          assert s["price_runtime"]["bytes"]==144539648
          assert s["home_market_rs_ready"] is False and s["sector_rs_ready"] is False
          assert hashlib.sha256(Path("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv").read_bytes()).hexdigest()=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert hashlib.sha256(Path("universe/SWING_U3K_FROZEN_v0.5.csv").read_bytes()).hexdigest()=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          print("v0.57 authority exact")
          PY

          D53="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10900287789 --jq .digest)"
          test "$D53" = "sha256:f54f1520e6cfcefbca043bc782ccf71ddd0e70538722ee1c3857551396761e95"
          rm -rf runtime_input/v053
          mkdir -p runtime_input/v053
          gh run download 36225840648 --repo "$GITHUB_REPOSITORY"             --name p0-frozen-1425-filtered-invalid-bar-policy-v0.53-36225840648             --dir runtime_input/v053
          test -f runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite
          test "$(sha256sum runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite | awk '{print $1}')" = "bccca4f168eb5fbd68822d5ebd96419066c69400014b8525a0bec60df0b07afc"
          test "$(stat -c %s runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite)" = "144539648"

      - name: Focused v0.58 contract tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/p0_frozen_1425_home_market_rs_materialization_v0_58.py scripts/persist_p0_frozen_1425_home_market_rs_v0_58.py
          pytest -q tests/test_p0_frozen_1425_home_market_rs_v0_58.py

      - name: Run bounded Home-Market RS gate
        run: |
          set -euo pipefail
          rm -rf output_p0_frozen_1425_home_market_rs_v0_58
          python scripts/p0_frozen_1425_home_market_rs_materialization_v0_58.py             --price-runtime runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite             --output-dir output_p0_frozen_1425_home_market_rs_v0_58             --repository-sha "$GITHUB_SHA"

      - name: Validate gate result and hard boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          out=Path("output_p0_frozen_1425_home_market_rs_v0_58")
          s=json.load(open(out/"summary_preupload_v0.58.json",encoding="utf-8"))
          c=json.load(open(out/"stage_checkpoint_preupload_v0.58.json",encoding="utf-8"))
          tests=list(csv.DictReader(open(out/"test_results_v0.58.csv",encoding="utf-8")))
          mapping=list(csv.DictReader(open(out/"benchmark_mapping_input_readiness_v0.58.csv",encoding="utf-8")))
          cap=list(csv.DictReader(open(out/"capability_v0.58.csv",encoding="utf-8")))

          assert s["verdict"] in {"PASS_HOME_MARKET_RS_READY","PASS_WITH_CONTRACT_BLOCKER","PASS_WITH_INPUT_BLOCKER"}
          assert len(mapping)==1425 and len(cap)==1425
          assert all(r["Result"]=="PASS" for r in tests)
          assert c["tests_failed"]==0
          assert s["sector_rs_ready"] is False
          assert s["p0_runs"]==0 and s["p1_p2_runs"]==0
          assert s["p0_numeric_pass_thresholds"]==[] and s["promoted_lane_pass_rules"]==[]
          assert all(v==0 for v in s["provider_calls"].values())

          if s["verdict"]=="PASS_HOME_MARKET_RS_READY":
              assert s["home_market_rs_ready"] is True
              assert s["ready_count"]==1425 and s["total"]==1425
              assert s["materialized"] is True
              assert s["determinism_match"] is True
              assert s["input_blockers"]==[]
              rs=list(csv.DictReader(open(out/"home_market_rs_materialization_v0.58.csv",encoding="utf-8")))
              temporal=list(csv.DictReader(open(out/"temporal_integrity_v0.58.csv",encoding="utf-8")))
              assert len(rs)==1425
              assert len({r["Security_Key"] for r in rs})==1425
              assert len({r["Source_WS_ID"] for r in rs})==1425
              assert len(temporal)==1425 and all(r["Result"]=="PASS" for r in temporal)
              assert all(r["HomeMarket_RS_Status"]=="HOME_MARKET_RS_READY" for r in cap)
          else:
              assert s["home_market_rs_ready"] is False

          assert hashlib.sha256(Path("universe/SWING_U3K_FROZEN_v0.5.csv").read_bytes()).hexdigest()=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert hashlib.sha256(Path("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv").read_bytes()).hexdigest()=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          print(json.dumps({"verdict":s["verdict"],"home_market_rs_ready":s["home_market_rs_ready"],"ready":s["ready_count"],"total":s["total"],"digest":s["rs_semantic_sha256"],"next_gate":s["next_gate"]},sort_keys=True))
          PY

          test "$(sha256sum runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite | awk '{print $1}')" = "bccca4f168eb5fbd68822d5ebd96419066c69400014b8525a0bec60df0b07afc"
          test "$(stat -c %s runtime_input/v053/runtime_cache/p0_frozen_1425_v0_53.sqlite)" = "144539648"
          test "$(git diff -- universe/SWING_U3K_FROZEN_v0.5.csv)" = ""
          test "$(git diff -- output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv)" = ""
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Upload bounded v0.58 evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: p0-frozen-1425-home-market-rs-v0.58-${{ github.run_id }}
          path: output_p0_frozen_1425_home_market_rs_v0_58/
          if-no-files-found: error
          retention-days: 14

      - name: Bind artifact and prepare persistent authority
        run: |
          set -euo pipefail
          python scripts/persist_p0_frozen_1425_home_market_rs_v0_58.py             --output-dir output_p0_frozen_1425_home_market_rs_v0_58             --artifact-id "${{ steps.upload.outputs.artifact-id }}"             --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"             --artifact-name "p0-frozen-1425-home-market-rs-v0.58-${{ github.run_id }}"             --workflow-run-id "${{ github.run_id }}"             --workflow-head-sha "$GITHUB_SHA"

      - name: Persist bounded v0.58 authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/P0_Frozen_1425_Home_Market_RS_Materialization_Capability_v0.58.md                   output_p0_frozen_1425_home_market_rs_v0_58/
          CHANGED="$(git diff --cached --name-only)"
          test -n "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(docs/validation/P0_Frozen_1425_Home_Market_RS_Materialization_Capability_v0\.58\.md|output_p0_frozen_1425_home_market_rs_v0_58/)' ; then
            echo "Unexpected staged path"
            exit 1
          fi
          git commit -m "Persist Home-Market RS capability v0.58 authority"
          git push origin HEAD:main
