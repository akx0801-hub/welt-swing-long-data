name: G-P0-05 v1.03 bounded candidate freeze validation
on:
  push:
    branches: [dev/g-p0-05-v1.03]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen candidate set
        shell: python
        run: |
          import csv,json,hashlib,pathlib,math
          d=pathlib.Path("output_p0_breakout_compression_vcp_candidate_set_v1_03")
          a=json.load(open("config/manager_governance_authority_G_P0_05_v1.03.json"))
          p=json.load(open("config/p0_parameter_authority_current.json"))
          rows=list(csv.DictReader(open(d/"lane1_candidate_set_v1.03.csv")))
          assert a["Decision"]=="APPROVED_FROZEN_CANDIDATE_SET_NO_SCORING"
          assert a["Candidate_Set_ID"]=="L1_BREAKOUT_VCP_CSET_01" and len(rows)==21
          assert len({r["Candidate_ID"] for r in rows})==21
          params=["Base_Window","Base_Width_Boundary","Stage2_Persistence","Pivot_Proximity_Cutoff_ATR","Climax_Move_ATR","Climax_RVOL","Climax_Close_Location","Runup_R20","Runup_R60","Runup_Pivot_Extension_ATR"]
          ref=next(r for r in rows if r["Candidate_ID"]=="L1-C00-REFERENCE")
          assert [ref[x] for x in params]==["30","0.18","3","1.25","2.25","2.25","0.5","0.2","0.35","1.25"]
          for r in rows:
            assert all(math.isfinite(float(r[x])) for x in params)
            if r["Candidate_ID"]!="L1-C00-REFERENCE": assert sum(r[x]!=ref[x] for x in params)==1
          fields=["Candidate_Set_ID","Candidate_ID"]+params+["Climax_Boolean_Contract","Runup_Boolean_Contract","Complete_Lane_Composition"]
          import io
          s=io.StringIO(newline=""); w=csv.writer(s,lineterminator="\n"); w.writerow(fields)
          for r in sorted(rows,key=lambda z:z["Candidate_ID"]): w.writerow([r[x] for x in fields])
          sha=hashlib.sha256(s.getvalue().encode()).hexdigest()
          assert sha=="8148c0bd2294bece39908d84394dda4fb0835210e83822997df12b9fbd0d6235"==a["Candidate_Set_Semantic_SHA256"]
          assert p["Authority_ID"]=="G-P0-01" and p["Version"]=="v0.99"
          assert p["p0_numeric_pass_thresholds"]==[] and p["promoted_lane_pass_rules"]==[]
          no=json.load(open(d/"no_outcome_access_audit_v1.03.json")); assert all(no[k]=="NO" for k in ["DESIGN_forward_outcomes_read","VALIDATION_forward_outcomes_read","HOLDOUT_forward_outcomes_read"])
          sc=json.load(open(d/"scope_exclusion_audit_v1.03.json")); assert sc["P0_RUNS"]==sc["P1_RUNS"]==sc["P2_RUNS"]==0
          t=list(csv.DictReader(open(d/"test_results_v1.03.csv"))); assert len(t)>=42 and all(r["Result"]=="PASS" for r in t)
          assert a["DESIGN_SCORING_AUTHORIZED"]=="YES" and a["DESIGN_SCORING_STARTED"]=="NO"
          assert a["VALIDATION_SCORING_AUTHORIZED"]=="NO" and a["HOLDOUT_OPENED"]=="NO" and a["P0_RUN_AUTHORIZED"]=="NO"
          print("PASS",sha)
      - name: Package evidence
        run: |
          mkdir artifact
          cp config/manager_governance_authority_G_P0_05_v1.03.json artifact/
          cp config/p0_parameter_authority_current.json artifact/
          cp -r output_p0_breakout_compression_vcp_candidate_set_v1_03 artifact/
          cp docs/validation/P0_Breakout_Compression_VCP_Frozen_Candidate_Set_G-P0-05_v1.03.md artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: g-p0-05-v1.03-frozen-candidate-set-evidence
          path: artifact/
