name: P0 Frozen 1425 NonReady10 Resume Diagnostic v0.48

on:
  push:
    branches: [main]
    paths:
      - scripts/p0_frozen_1425_nonready10_resume_diag_v0_48.py
      - .github/workflows/p0_frozen_1425_nonready10_resume_diag_v0.48.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded provider client
        run: python -m pip install --disable-pip-version-check "yfinance==1.0" pandas numpy
      - name: Download exact v0.47 runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime_input/v047
          gh run download 36177809571 --repo "$GITHUB_REPOSITORY" \
            --name p0-frozen-1425-runtime-refreeze-v0.47-36177809571 \
            --dir runtime_input/v047
          test -f runtime_input/v047/runtime_cache/p0_frozen_1425_v0_47.sqlite
      - name: Run exact-10 persisted extraction and bounded provider reproducibility test
        run: |
          set -euo pipefail
          rm -rf output_p0_frozen_1425_nonready10_resume_diag_v0_48
          python scripts/p0_frozen_1425_nonready10_resume_diag_v0_48.py \
            --sqlite runtime_input/v047/runtime_cache/p0_frozen_1425_v0_47.sqlite \
            --out output_p0_frozen_1425_nonready10_resume_diag_v0_48
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-frozen-1425-nonready10-resume-diag-v0.48-${{ github.run_id }}
          path: output_p0_frozen_1425_nonready10_resume_diag_v0_48/
          if-no-files-found: error
          retention-days: 14
