name: Persist P0 Frozen 1425 Local Feature Contract v0.56

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/persist_p0_frozen_1425_local_feature_contract_v0.56.yml

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact successful v0.56 contract artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b6426f24c30c213949d436d205f9188f22c21d84 HEAD
          DIGEST="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10904166471 --jq .digest)"
          test "$DIGEST" = "sha256:17acd42edc06fe7311d88e27ee0a1a2052145e92440e487c2e0f0a47a10709ed"
          rm -rf _v056_artifact
          mkdir -p _v056_artifact/output_p0_frozen_1425_local_feature_contract_v0_56
          gh run download 36235568433 --repo "$GITHUB_REPOSITORY" \
            --name p0-frozen-1425-local-feature-contract-v0.56-36235568433 \
            --dir _v056_artifact/output_p0_frozen_1425_local_feature_contract_v0_56
          test -f _v056_artifact/output_p0_frozen_1425_local_feature_contract_v0_56/summary_preupload_v0.56.json

      - name: Prepare final bounded authority
        run: |
          set -euo pipefail
          python scripts/persist_p0_frozen_1425_local_feature_contract_v0_56.py \
            --artifact-dir _v056_artifact \
            --repo-root .
          rm -rf _v056_artifact

      - name: Commit final bounded authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/P0_Frozen_1425_Local_Feature_Contract_Definition_v0.56.md \
                  output_p0_frozen_1425_local_feature_contract_v0_56/
          test "$(git diff --cached --name-only | grep -c '^scripts/feature_builder.py$' || true)" = "0"
          test "$(git diff --cached --name-only | grep -c '^universe/' || true)" = "0"
          test "$(git diff --cached --name-only | grep -c '^runtime_cache/' || true)" = "0"
          git commit -m "Persist local feature contract definition v0.56 authority"
          git push origin HEAD:main
