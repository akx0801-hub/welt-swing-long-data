name: AU SP ASX200 GICS Industry Group Code Gate D v0.84

on:
  push:
    branches: [main]
    paths:
      - config/au_sp_asx200_gics_industry_group_code_gate_d_v0.84.json

permissions:
  contents: write
  actions: read

jobs:
  au-asx200-gate-d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bounded v0.84 stage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify lineage and bounded scope
        run: |
          set -euo pipefail
          START="258ecaa5e697f9bc51f0586bb6c2f2a3ee961647"
          git merge-base --is-ancestor "$START" HEAD
          BAD="$(git diff --name-only "$START"..HEAD | grep -Ev '^(config/au_sp_asx200_gics_industry_group_code_gate_d_spec_v0\.84\.json|scripts/au_sp_asx200_gics_industry_group_code_gate_d_v0_84\.py|scripts/persist_au_sp_asx200_gics_industry_group_code_gate_d_v0_84\.py|tests/test_au_sp_asx200_gics_industry_group_code_gate_d_v0_84\.py|\.github/workflows/au_sp_asx200_gics_industry_group_code_gate_d_v0\.84\.yml|config/au_sp_asx200_gics_industry_group_code_gate_d_v0\.84\.json|docs/validation/AU_SP_ASX200_GICS_Industry_Group_Code_Feasibility_Gate_D_v0\.84\.md|output_au_sp_asx200_gics_code_gate_d_v0_84/.*)$' || true)"
          test -z "$BAD"

      - name: Verify exact v0.83 predecessor and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10940184410 --jq .digest)"
          test "$DIGEST" = "sha256:2534f3e6be146e6bc46e36c1d39e90c82392a57408d3c684a44f7f8656fd983d"
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          out=Path("output_au_sp_asx200_final_gate_c_provenance_v0_83")
          s=json.load(open(out/"summary_v0.83.json",encoding="utf-8"))
          c=json.load(open(out/"stage_checkpoint_v0.83.json",encoding="utf-8"))
          m=json.load(open(out/"manifest_v0.83.json",encoding="utf-8"))
          d=json.load(open(out/"au_source_native_taxonomy_identity_decision_v0.83.json",encoding="utf-8"))
          assert s["verdict"]=="PASS_AU_SP_ASX200_SOURCE_NATIVE_TAXONOMY_IDENTITY_GATE_C"
          assert s["au_source_native_taxonomy_identity_ready"] is True
          assert s["taxonomy_identity"]=="GICS"
          assert s["taxonomy_owner"]=="S&P Dow Jones Indices / MSCI"
          assert s["formal_level"]=="INDUSTRY_GROUP"
          assert s["version_status"]=="CURRENT_MAINTAINED_NO_STATIC_VERSION"
          assert s["download_classification_header"]=="GICs industry group"
          assert s["field_to_taxonomy_binding"]=="PASS_CURRENT_RUNTIME_AND_OFFICIAL_ASX_SEMANTICS"
          assert s["tests"]=={"failed":0,"passed":22,"total":22}
          assert c["workflow_run_id"]==36345799341 and c["artifact_id"]==10940184410
          assert c["artifact_digest"]=="sha256:2534f3e6be146e6bc46e36c1d39e90c82392a57408d3c684a44f7f8656fd983d"
          assert m["workflow_run_id"]==36345799341 and m["artifact_id"]==10940184410
          assert d["Gate_D"]=="NOT_EVALUATED" and d["Gate_E"]=="NOT_EVALUATED" and d["Gate_F"]=="NOT_EVALUATED"
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          assert sha("sector_metadata/governance/parked_cohort_registry_v1.csv")=="38c05124088300464edae7dbd2c46f5ebf541ea6b3233dcdc9701b5a22c461dd"
          reg=list(csv.DictReader(open("sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv",encoding="utf-8")))
          assert len(reg)==1 and reg[0]["Cohort"]=="BR_IBRX100"
          assert reg[0]["Semantic_SHA256"]=="bd975af67f46d6961f50480fe3eea391bd807d6c65c1a376717fbd0c07d19aed"
          PY

      - name: Verify v0.84 spec and trigger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open("config/au_sp_asx200_gics_industry_group_code_gate_d_spec_v0.84.json",encoding="utf-8"))
          t=json.load(open("config/au_sp_asx200_gics_industry_group_code_gate_d_v0.84.json",encoding="utf-8"))
          assert s["required_start_head"]=="258ecaa5e697f9bc51f0586bb6c2f2a3ee961647"
          assert s["scope"]["gate_d_only"] is True
          assert s["scope"]["gate_e_allowed"] is False
          assert s["scope"]["gate_f_allowed"] is False
          assert s["scope"]["gate_h_allowed"] is False
          assert s["scope"]["frozen_63_linkage_allowed"] is False
          assert s["scope"]["canonical_materialization_allowed"] is False
          assert s["forbidden"]["alpha_vantage"] is True
          assert t["version"]=="v0.84"
          assert t["required_start_head"]==s["required_start_head"]
          assert t["gate_d_authorized"] is True
          assert t["gate_e_f_allowed"] is False
          assert t["gate_h_allowed"] is False
          assert t["frozen_63_linkage_allowed"] is False
          assert t["canonical_materialization_allowed"] is False
          assert t["productive"] is False
          PY

      - name: Prepare browser and PDF tooling
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --index-url https://pypi.org/simple websocket-client==1.8.0 "pypdf>=5,<7"
          python3 - <<'PY'
          import importlib.metadata,shutil
          from pathlib import Path
          assert importlib.metadata.version("websocket-client")=="1.8.0"
          chrome=next((p for p in ["/usr/bin/google-chrome","/usr/bin/google-chrome-stable","/usr/bin/chromium","/usr/bin/chromium-browser"] if Path(p).exists()),None)
          if not chrome:chrome=shutil.which("google-chrome") or shutil.which("chromium")
          assert chrome,"Chrome/Chromium unavailable"
          print("CHROME="+chrome)
          print("PYPDF="+importlib.metadata.version("pypdf"))
          PY

      - name: Compile and unit-test
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/au_sp_asx200_gics_industry_group_code_gate_d_v0_84.py scripts/persist_au_sp_asx200_gics_industry_group_code_gate_d_v0_84.py
          python3 tests/test_au_sp_asx200_gics_industry_group_code_gate_d_v0_84.py -v

      - name: Run bounded AU Gate D
        run: |
          set -euo pipefail
          rm -rf output_au_sp_asx200_gics_code_gate_d_v0_84
          python3 scripts/au_sp_asx200_gics_industry_group_code_gate_d_v0_84.py             --repository-sha "$GITHUB_SHA"             --output-dir output_au_sp_asx200_gics_code_gate_d_v0_84

      - name: Validate result and hard scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          out=Path("output_au_sp_asx200_gics_code_gate_d_v0_84")
          req=[
            "au_gate_d_predecessor_authority_v0.84.json",
            "asx_current_gics_industry_group_value_inventory_v0.84.csv",
            "gics_official_source_inventory_v0.84.csv",
            "gics_hierarchy_level_authority_v0.84.json",
            "gics_industry_group_official_label_code_inventory_v0.84.csv",
            "asx_to_gics_exact_same_taxonomy_label_binding_audit_v0.84.csv",
            "gics_industry_group_code_uniqueness_audit_v0.84.csv",
            "au_formal_vs_nonformal_classification_value_reconciliation_v0.84.json",
            "au_classification_sentinel_governance_audit_v0.84.csv",
            "au_source_native_code_feasibility_decision_v0.84.json",
            "au_pdsc_fallback_necessity_audit_v0.84.json",
            "au_pdsc_distinct_label_feasibility_audit_v0.84.csv",
            "au_pdsc_collision_audit_v0.84.json",
            "au_sector_field_code_feasibility_decision_v0.84.json",
            "external_request_ledger_v0.84.csv",
            "provider_call_audit_v0.84.json",
            "immutability_audit_v0.84.json",
            "test_results_v0.84.csv",
            "summary_preupload_v0.84.json",
            "stage_checkpoint_preupload_v0.84.json",
            "manifest_preupload_v0.84.json"
          ]
          assert all((out/x).exists() for x in req)
          s=json.load(open(out/"summary_preupload_v0.84.json",encoding="utf-8"))
          d=json.load(open(out/"au_sector_field_code_feasibility_decision_v0.84.json",encoding="utf-8"))
          n=json.load(open(out/"au_source_native_code_feasibility_decision_v0.84.json",encoding="utf-8"))
          p=json.load(open(out/"provider_call_audit_v0.84.json",encoding="utf-8"))
          imm=json.load(open(out/"immutability_audit_v0.84.json",encoding="utf-8"))
          tests=list(csv.DictReader(open(out/"test_results_v0.84.csv",encoding="utf-8")))
          sent=list(csv.DictReader(open(out/"au_classification_sentinel_governance_audit_v0.84.csv",encoding="utf-8")))
          assert all(r["Result"]=="PASS" for r in tests)
          assert d["Gate_E"]=="NOT_EVALUATED" and d["Gate_F"]=="NOT_EVALUATED" and d["Gate_H"]=="NOT_EVALUATED"
          assert all(r["Canonical_Code_Eligibility"]=="NO" and r["PDSC_Eligibility"]=="NO" for r in sent)
          zero=["Alpha_Vantage","Yahoo_yfinance","EODHD","Scalable","TradingView","Wikipedia","ETF_holdings","third_party_GICS_tables",
                "third_party_security_sector_databases","company_name_Frozen_linkage","fuzzy_matching","semantic_classification_inference",
                "cross_taxonomy_mapping","per_security_web_fanout","price_OHLCV","news","trading_analysis","AU_Gate_E","AU_Gate_F","Gate_H",
                "canonical_materialization","Sector_RS","P0","P1","P2"]
          assert all(p[k]==0 for k in zero)
          assert p["fresh_ASX_downloads"]==1
          assert imm["Frozen_Unchanged"] and imm["v057_Unchanged"] and imm["v058_Unchanged"] and imm["BR_Canonical_Semantic_Unchanged"]
          assert imm["Parked_Cohort_Registry_Unchanged"]
          assert imm["Canonical_READY_Rows_After"]==37 and imm["Canonical_Total_Rows"]==1425
          assert imm["AU_Canonical_Rows_After"]==0 and imm["Frozen_63_Linkage_Runs"]==0
          assert not list(Path("sector_metadata/canonical/cohorts").glob("AU_SP_ASX200_*.csv"))
          if s["au_sector_field_code_feasibility_ready"]:
              assert s["verdict"]=="PASS_AU_SP_ASX200_GICS_INDUSTRY_GROUP_CODE_FEASIBILITY_GATE_D"
              assert d["Gate_D"]=="PASS_BY_CURRENT_GOVERNANCE"
              assert d["Code_Strategy"] in {"SOURCE_NATIVE_GICS_CODE","PROJECT_DERIVED_CANONICAL_PDSC"}
              assert s["next_gate"]=="AU_SP_ASX200 DETERMINISTIC SECURITY IDENTITY LINKAGE GATE E"
              assert s["blocker"]==""
              if d["Code_Strategy"]=="SOURCE_NATIVE_GICS_CODE":
                  assert n["SOURCE_NATIVE_GICS_CODE_READY"]=="YES"
                  assert s["pdsc_fallback_required"] is False
          else:
              assert s["verdict"]=="BLOCKED_AU_SP_ASX200_GICS_INDUSTRY_GROUP_CODE_FEASIBILITY_GATE_D"
              assert s["blocker"] in {
                "GICS_OFFICIAL_CLASSIFICATION_STRUCTURE_NOT_REPRODUCIBLE",
                "GICS_INDUSTRY_GROUP_LEVEL_NOT_VERIFIED",
                "ASX_GICS_FORMAL_LABEL_NOT_FOUND_IN_OFFICIAL_GICS",
                "GICS_INDUSTRY_GROUP_CODE_NOT_VERIFIED",
                "GICS_LABEL_TO_CODE_BINDING_AMBIGUOUS",
                "GICS_CODE_COLLISION",
                "AU_FORMAL_CLASSIFICATION_VALUE_SET_NOT_RECONCILED",
                "AU_PDSC_INPUT_CONTRACT_NOT_VERIFIED",
                "AU_PDSC_COLLISION",
                "AU_SECTOR_FIELD_CODE_FEASIBILITY_NOT_VERIFIED",
                "AUTHORITY_REGRESSION_REVIEW_REQUIRED"
              }
          PY
          BAD="$(git status --porcelain --untracked-files=no | sed 's/^...//' | grep -Ev '^(output_au_sp_asx200_gics_code_gate_d_v0_84/.*|docs/validation/AU_SP_ASX200_GICS_Industry_Group_Code_Feasibility_Gate_D_v0\.84\.md)$' || true)"
          test -z "$BAD"

      - name: Upload bounded v0.84 evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: au-asx200-gics-code-gate-d-v0.84-${{ github.run_id }}
          path: output_au_sp_asx200_gics_code_gate_d_v0_84/
          if-no-files-found: error
          retention-days: 14

      - name: Bind artifact and prepare persistence
        run: |
          set -euo pipefail
          python3 scripts/persist_au_sp_asx200_gics_industry_group_code_gate_d_v0_84.py             --output-dir output_au_sp_asx200_gics_code_gate_d_v0_84             --artifact-id "${{ steps.upload.outputs.artifact-id }}"             --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"             --artifact-name "au-asx200-gics-code-gate-d-v0.84-${{ github.run_id }}"             --workflow-run-id "${{ github.run_id }}"             --workflow-head-sha "$GITHUB_SHA"

      - name: Persist bounded v0.84 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/AU_SP_ASX200_GICS_Industry_Group_Code_Feasibility_Gate_D_v0.84.md                   output_au_sp_asx200_gics_code_gate_d_v0_84/
          CHANGED="$(git diff --cached --name-only)"
          test -n "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(docs/validation/AU_SP_ASX200_GICS_Industry_Group_Code_Feasibility_Gate_D_v0\.84\.md|output_au_sp_asx200_gics_code_gate_d_v0_84/.*)$'; then
            echo "Unexpected staged path"; exit 1
          fi
          test ! -e sector_metadata/canonical/cohorts/AU_SP_ASX200_sector_metadata_v1.csv
          git commit -m "Persist AU ASX200 GICS code Gate D v0.84"
          git push origin HEAD:main
