name: Welt-Swing Final 8 Evidence Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'openpyxl>=3.1,<4'

      - name: Schutzregel - kein Preis-/History-Lauf
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          p = Path('scripts/freeze_final_8_evidence.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          forbidden = []

          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              fn = node.func
              if isinstance(fn, ast.Attribute) and fn.attr in {
                  'download', 'history', 'get_history_metadata'
              }:
                  forbidden.append((fn.attr, getattr(node, 'lineno', None)))

          if forbidden:
              raise SystemExit(f'Forbidden price/history calls found: {forbidden}')
          print('NO_PRICE_HISTORY_CALLS_OK')
          PY

      - name: 8er Evidence-Selbsttest
        run: |
          python scripts/freeze_final_8_evidence.py \
            --evidence config/final_8_evidence_freeze_v0.1.csv \
            --self-test

      - name: Eingaben prüfen
        run: |
          test -f universe/Welt-Swing-Universe-Master-FinalMapped-v0.6.csv
          test -f output_identity_final/review_queue_v0.3.csv
          test -f config/final_8_evidence_freeze_v0.1.csv
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv(
              'universe/Welt-Swing-Universe-Master-FinalMapped-v0.6.csv',
              keep_default_na=False, dtype=str
          )
          q = pd.read_csv(
              'output_identity_final/review_queue_v0.3.csv',
              keep_default_na=False, dtype=str
          )
          e = pd.read_csv(
              'config/final_8_evidence_freeze_v0.1.csv',
              keep_default_na=False, dtype=str
          )
          assert len(m) == 3664, len(m)
          assert len(q) == 8, len(q)
          assert len(e) == 8, len(e)
          assert set(q['WS_ID']) == set(e['WS_ID'])
          assert not m['WS_ID'].duplicated().any()
          print('FINAL_8_INPUT_GATE_OK')
          PY

      - name: Evidence Freeze ausführen
        run: |
          python scripts/freeze_final_8_evidence.py

      - name: Freeze-Gates prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output_identity_evidence_freeze/summary_v0.1.json')
          x = json.loads(p.read_text(encoding='utf-8'))

          print('RUN_STATUS', x['run_status'])
          print('ACTIVE_MAPPING', x['active_provider_mapped'], '/', x['active_rows'])
          print('ACTIVE_UNRESOLVED', x['active_provider_unresolved'])
          print('COVERAGE_READY', x['price_run_candidate_coverage_ready'])

          assert x['run_status'] == 'EVIDENCE_FREEZE_COMPLETE'
          assert x['master_rows'] == 3664
          assert x['active_rows'] == 3663
          assert x['active_provider_mapped'] == 3663
          assert x['active_provider_unresolved'] == 0
          assert x['active_provider_mapping_pct'] == 100.0
          assert x['evidence_rows_frozen'] == 8
          assert x['price_run_candidate_coverage_ready'] is True
          assert x['price_run_allowed_after_this_step'] is False
          assert x['productive_trading_authority'] is False
          assert x['p0_run'] is False
          assert x['alpha_vantage_allowed'] is False
          PY

      - name: Ergebnisse committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe/Welt-Swing-Universe-Master-EvidenceFrozen-v0.7.csv \
                  universe/Welt-Swing-Universe-Master-EvidenceFrozen-v0.7.xlsx \
                  output_identity_evidence_freeze/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Freeze final 8 provider mappings by evidence"
            git push
          fi

      - name: Evidence-Freeze-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-final-8-evidence-freeze-${{ github.run_number }}
          path: |
            universe/Welt-Swing-Universe-Master-EvidenceFrozen-v0.7.csv
            universe/Welt-Swing-Universe-Master-EvidenceFrozen-v0.7.xlsx
            output_identity_evidence_freeze/
          retention-days: 14
