name: Welt-Swing G3 210 Pilot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  g3:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'openpyxl>=3.1,<4'
      - name: Offline-Selbsttest
        run: python scripts/self_test.py

      - name: Aktuellen r6 Universe Master prüfen und G3-210 bauen
        run: |
          test -f universe/Welt-Swing-Universe-Master-v2.0.xlsx
          python scripts/build_g3_pilot.py \
            universe/Welt-Swing-Universe-Master-v2.0.xlsx \
            --out universe/g3_pilot_210.csv \
            --manifest universe/g3_pilot_210_manifest.json \
            --per-segment 30 \
            --require-master-rows 1535

      - name: G3 Price Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: runtime_cache/g3_pilot_210_prices.sqlite
          key: g3-210-price-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            g3-210-price-${{ runner.os }}-

      - name: G3 yfinance Datenlauf starten
        run: python scripts/run_update.py --config config/run_config_g3.json

      - name: G3 Ergebnisdateien speichern
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe/g3_pilot_210.csv universe/g3_pilot_210_manifest.json output_g3/
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Update Welt-Swing G3 210 pilot data"
            git push
          fi

      - name: G3 Ergebnisse als Action-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-g3-210-output-${{ github.run_number }}
          path: |
            output_g3/
            universe/g3_pilot_210.csv
            universe/g3_pilot_210_manifest.json
          retention-days: 7

      - name: G3 Laufstatus prüfen
        run: python scripts/assert_run_status.py output_g3/coverage.json
