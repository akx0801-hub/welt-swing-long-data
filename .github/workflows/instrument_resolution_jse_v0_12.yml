name: Welt-Swing Instrument Resolution JSE v0.12

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/instrument_resolution_jse_v0.12.json'

permissions:
  contents: write

jobs:
  resolve_jse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Offline-Selbsttest
        run: python scripts/classify_instruments_jse_v0_12.py --self-test

      - name: Frozen-Input-Gates
        shell: bash
        run: |
          test -f output_instrument_resolution_v0_11/summary_v0.11.json
          test -f output_instrument_resolution_v0_11/instrument_manual_review_queue_v0.11.csv
          test -f output_instrument_resolution_v0_10/eligibility_after_instrument_v0.10.csv
          test -f output_instrument_resolution_v0_10/strict_u3k_candidate_after_instrument_v0.10.csv

          test "$(git hash-object output_instrument_resolution_v0_11/summary_v0.11.json)" = "28a5596cbed26f34467200b27191a7de12397452"
          test "$(git hash-object output_instrument_resolution_v0_11/instrument_manual_review_queue_v0.11.csv)" = "4a2f08620df7ea710ae72725955298819aabb18b"
          test "$(git hash-object output_instrument_resolution_v0_10/eligibility_after_instrument_v0.10.csv)" = "757c781823d89cbffe2b8907dadf7428f69a3f7c"
          test "$(git hash-object output_instrument_resolution_v0_10/strict_u3k_candidate_after_instrument_v0.10.csv)" = "ee30df5638fa0564bbde0dfb7feead4e198bdc9a"

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          s = json.loads(Path('output_instrument_resolution_v0_11/summary_v0.11.json').read_text(encoding='utf-8'))
          q = pd.read_csv('output_instrument_resolution_v0_11/instrument_manual_review_queue_v0.11.csv',
                          keep_default_na=False, dtype=str)

          assert s['schema'] == 'WELT_SWING_JSE_ISIN_BULK_PROBE_V0_11'
          assert s['run_status'] == 'JSE_ISIN_BULK_PROBE_V0_11_COMPLETE_WITH_EVIDENCE'
          assert s['remaining_manual_rows_v0_11'] == 667
          assert s['strict_candidates_v0_11'] == 2020
          assert s['jse_probe_status'] == 'JSE_ISINFULL_ZIP_PARSED'
          assert s['jse_page_http_status'] == 200
          assert s['jse_zip_http_status'] == 200
          assert s['p0_run'] is False
          assert s['alpha_vantage_allowed'] is False
          assert len(q) == 667
          assert (q['Primary_Universe_Index'] == 'ZA_TOP40').sum() == 17
          print('INSTRUMENT_RESOLUTION_JSE_V0_12_INPUT_GATE_PASS')
          PY

      - name: JSE Instrument Type klassifizieren
        run: |
          python scripts/classify_instruments_jse_v0_12.py \
            --config config/instrument_resolution_jse_v0.12.json

      - name: Ergebnis-Gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          x = json.loads(Path('output_instrument_resolution_v0_12/summary_v0.12.json').read_text(encoding='utf-8'))
          print(json.dumps(x, indent=2, ensure_ascii=False))

          assert x['schema'] == 'WELT_SWING_INSTRUMENT_RESOLUTION_JSE_V0_12'
          assert x['run_status'] in {
              'INSTRUMENT_RESOLUTION_JSE_V0_12_COMPLETE_WITH_REMAINING_REVIEW',
              'INSTRUMENT_RESOLUTION_JSE_V0_12_COMPLETE_WITH_SOURCE_OR_LAYOUT_BLOCK',
          }
          assert x['source_manual_rows_v0_11'] == 667
          assert x['za_target_rows'] == 17
          assert x['jse_pass_rows'] + x['jse_fail_rows'] + x['jse_unresolved_rows'] == 17
          assert x['remaining_manual_rows_v0_12'] == 667 - x['jse_pass_rows'] - x['jse_fail_rows']
          assert x['strict_candidates_v0_11'] == 2020
          assert x['strict_candidates_v0_12'] == 2020 + x['jse_pass_rows']
          assert 1 <= x['external_reference_requests'] <= 2
          assert x['max_external_reference_requests'] == 2
          assert x['request_bound_respected'] is True
          assert x['strict_freeze_allowed'] is False
          assert x['p0_run'] is False
          assert x['productive_trading_authority'] is False
          assert x['alpha_vantage_allowed'] is False
          assert x['price_downloads_performed'] is False
          assert x['fx_downloads_performed'] is False
          assert x['web_calls_per_security'] is False
          assert x['canonical_master_mutated'] is False

          q = pd.read_csv('output_instrument_resolution_v0_12/instrument_manual_review_queue_v0.12.csv',
                          keep_default_na=False, dtype=str)
          s = pd.read_csv('output_instrument_resolution_v0_12/strict_u3k_candidate_after_instrument_v0.12.csv',
                          keep_default_na=False, dtype=str)

          assert len(q) == x['remaining_manual_rows_v0_12']
          assert len(s) == x['strict_candidates_v0_12']

          if x['record_layout_validated']:
              assert x['jse_reference_rows'] > 0
              assert x['jse_matched_rows'] <= 17

          print('INSTRUMENT_RESOLUTION_JSE_V0_12_RESULT_GATES_PASS')
          PY

      - name: Ergebnisse committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_instrument_resolution_v0_12/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Resolve JSE instrument types v0.12"
            git push
          fi

      - name: Audit-Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-instrument-resolution-jse-v0.12-${{ github.run_number }}
          path: output_instrument_resolution_v0_12/
          retention-days: 14
