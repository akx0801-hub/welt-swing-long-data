name: Welt-Swing BR IBrX100 Eligibility Completion and Import Plan v0.33

on:
  push:
    branches:
      - main
    paths:
      - config/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0.33.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-master-br-ibrx100-eligibility-plan-v0.33
  cancel-in-progress: false

jobs:
  br_ibrx100_eligibility_gate_completion_import_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Python compile gate
        run: |
          python -m py_compile scripts/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0_33.py

      - name: Self-Test
        run: |
          python scripts/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0_33.py --self-test

      - name: Frozen-Input-Gates
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            test -f "$path"
            local actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "FROZEN INPUT MISMATCH: $path expected=$expected actual=$actual"
              exit 1
            fi
          }
          check_blob "docs/spec/WELT-SWING-LONG-DEV-v0.1-MASTER-2026-08-23.md" "680d0434e534d1fe136e694ca05cb574958a1a24"
          check_blob "WELT-SWING-CURRENT-Handoff-v0.32.md" "6c89d8bf69a5cd4d7a0c522d836d9587ce052d42"
          check_blob "output_current_master_br_ibrx100_liquidity_v0_32/summary_v0.32.json" "59e2fe0a2ebcb07a818071e065b8f16883cfabdb"
          check_blob "output_current_master_br_ibrx100_liquidity_v0_32/stage_checkpoint_v0.32.json" "02a23ebcb68827f57b764629c69e096813f4e9b8"
          check_blob "output_current_master_br_ibrx100_liquidity_v0_32/br_ibrx100_liquidity_precheck_v0.32.csv" "c03010329f7f74fca50576d9be5e0250cf3b0fd9"
          check_blob "universe/segments/br_ibrx100_source_frozen_v0.32.csv" "aeb03d77ae80818312cbeb70e2643bae1f521fde"
          check_blob "universe/segments/br_ibrx100_strict_ordinary_frozen_v0.32.csv" "92420932bf9c50ddc304442c03315003ac2a7b11"
          check_blob "output_current_master_membership_identity_reconciliation_v0_31/br_ibrx100_identity_reconciliation_v0.31.csv" "aeb03d77ae80818312cbeb70e2643bae1f521fde"
          check_blob "universe/Welt-Swing-Universe-Master-v2.0.xlsx" "0d58014169873ac0ee52ca739a60e09f8bd5799f"

      - name: History Eligibility and Import-Plan Stage
        run: |
          python scripts/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0_33.py \
            --config config/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0.33.json

      - name: Ergebnis-Gates
        run: |
          python scripts/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0_33.py \
            --config config/current_master_br_ibrx100_eligibility_gate_completion_import_plan_v0.33.json \
            --validate
          git diff --exit-code -- universe/Welt-Swing-Universe-Master-v2.0.xlsx universe/research_partial_1535.csv

      - name: Outputs und CURRENT Handoff committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_current_master_br_ibrx100_eligibility_plan_v0_33/
          git add WELT-SWING-CURRENT-Handoff-v0.33.md
          git add WELT-SWING-CURRENT-Handoff-CURRENT.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Complete B3 IBrX100 eligibility plan v0.33"
            git push
          fi

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: current-master-br-ibrx100-eligibility-plan-v0.33
          path: |
            output_current_master_br_ibrx100_eligibility_plan_v0_33/
            WELT-SWING-CURRENT-Handoff-v0.33.md
            WELT-SWING-CURRENT-Handoff-CURRENT.md
