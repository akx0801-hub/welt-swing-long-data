name: Welt-Swing Current Master Universe Reconciliation v0.28

on:
  workflow_dispatch:
  push:
    paths:
      - "config/current_master_universe_reconciliation_freeze_plan_v0.28.json"

permissions:
  contents: write
  actions: read

jobs:
  reconcile_current_master:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Selbsttest
        run: |
          python -m py_compile scripts/current_master_universe_reconciliation_freeze_plan_v0_28.py
          python scripts/current_master_universe_reconciliation_freeze_plan_v0_28.py --self-test

      - name: Frozen-Input-Gates
        shell: bash
        run: |
          set -euo pipefail
          check_blob () {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            echo "$path -> $actual"
            test "$actual" = "$expected"
          }

          check_blob "docs/spec/WELT-SWING-LONG-DEV-v0.1-MASTER-2026-08-23.md" "680d0434e534d1fe136e694ca05cb574958a1a24"
          check_blob "universe/Welt-Swing-Universe-Master-v2.0.xlsx" "0d58014169873ac0ee52ca739a60e09f8bd5799f"
          check_blob "universe/research_partial_1535.csv" "246db0440e49ecd1108d74a8d939fc1988ce38b0"
          check_blob "universe/research_partial_1535_manifest.json" "00f4093794e363ec51615e107b3807634b621773"
          check_blob "output_research_1535/coverage.json" "3eb3075412c38ee423b5fd84d5bddbbb1fcdd9dc"
          check_blob "output_official_security_type_data_requalification_v0_27/summary_v0.27.json" "022f82b2f71055cc89cc0bd6a57dc43b9363d598"
          check_blob "output_official_security_type_data_requalification_v0_27/stage_checkpoint_v0.27.json" "015955aba04912d7e849ceacb2dc1b5a5912f358"

      - name: Current-Master Reconciliation
        run: |
          python scripts/current_master_universe_reconciliation_freeze_plan_v0_28.py \
            --config config/current_master_universe_reconciliation_freeze_plan_v0.28.json

      - name: Ergebnis-Gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path("output_current_master_reconciliation_v0_28")
          s = json.loads((out/"summary_v0.28.json").read_text(encoding="utf-8"))
          c = json.loads((out/"stage_checkpoint_v0.28.json").read_text(encoding="utf-8"))
          m = json.loads((out/"manifest_v0.28.json").read_text(encoding="utf-8"))
          seg = pd.read_csv(out/"current_master_segment_inventory_v0.28.csv", keep_default_na=False)
          ident = pd.read_csv(out/"current_master_identity_quality_v0.28.csv", keep_default_na=False)
          blockers = pd.read_csv(out/"current_master_blocker_register_v0.28.csv", keep_default_na=False)
          lineages = pd.read_csv(out/"lineage_authority_matrix_v0.28.csv", keep_default_na=False)

          assert s["run_status"] == "CURRENT_MASTER_UNIVERSE_RECONCILIATION_FREEZE_PLAN_V0_28_COMPLETE"
          assert s["stage_status"] == "PARTIAL"
          assert s["lineage_scope"] == "CURRENT_MASTER_CLEAN_RESTART"
          assert s["target_segment_count"] == 14
          assert s["imported_segment_count"] == 7
          assert s["missing_segment_count"] == 7
          assert s["current_master_rows"] == 1535
          assert sum(s["imported_segment_counts"].values()) == 1535

          assert len(seg) == 14
          assert (seg["Current_Master_Rows"].astype(int) > 0).sum() == 7
          assert (seg["Current_Master_Rows"].astype(int) == 0).sum() == 7
          assert len(blockers) == 7
          assert set(blockers["Segment_ID"]) == {
              "US_SP1500","MX_IPC","KR_KOSPI200","AU_ASX200","NZ_NZX50","BR_IBRX100","ZA_TOP40"
          }
          us = blockers.loc[blockers["Segment_ID"].eq("US_SP1500")].iloc[0]
          assert us["Source_Gate_State_v0_28"] == "SOURCE_BLOCKED_FULL_EXPORT_LOGIN_REQUIRED"

          assert s["identity_quality"]["rows"] == 1535
          assert s["identity_quality"]["duplicate_ws_id_rows"] == 0
          assert len(ident) == 7

          assert s["source_superset_complete"] is False
          assert s["source_superset_frozen"] is False
          assert s["swing_u3k_eligible_ready"] is False
          assert s["swing_u3k_frozen"] is False
          assert s["p0_run"] is False
          assert s["sector_rs_performed"] is False
          assert s["price_downloads_performed"] is False
          assert s["external_requests"] == 0
          assert s["per_security_web_calls"] is False
          assert s["alpha_vantage_allowed"] is False
          assert s["productive_trading_authority"] is False
          assert s["legacy_phase2_canonical_source_authority"] is False
          assert s["coverage_gate_status"] == "BLOCKED_CURRENT_MASTER_SOURCE_SUPERSET_INCOMPLETE_7_OF_14"
          assert s["next_stage"] == "CURRENT_MASTER_MISSING_SEGMENT_OFFICIAL_SOURCE_MATERIALIZATION"

          assert c["status"] == "PARTIAL"
          assert c["input_count"] == 14
          assert c["checked_count"] == 14
          assert c["pass_count"] == 7
          assert c["fail_count"] == 7
          assert c["data_error_count"] == 0

          assert len(lineages) == 3
          legacy = lineages.loc[lineages["Lineage"].eq("LEGACY_PRE_MASTER_PHASE2")].iloc[0]
          assert str(legacy["Source_Authority_For_Current_Master"]).lower() == "false"

          assert Path("WELT-SWING-CURRENT-Handoff-v0.28.md").exists()
          assert Path("WELT-SWING-CURRENT-Handoff-CURRENT.md").exists()
          assert Path("WELT-SWING-CURRENT-Handoff-v0.28.md").read_bytes() == Path("WELT-SWING-CURRENT-Handoff-CURRENT.md").read_bytes()

          required = {
              "output_current_master_reconciliation_v0_28/current_master_segment_inventory_v0.28.csv",
              "output_current_master_reconciliation_v0_28/current_master_identity_quality_v0.28.csv",
              "output_current_master_reconciliation_v0_28/current_master_source_authority_audit_v0.28.csv",
              "output_current_master_reconciliation_v0_28/current_master_blocker_register_v0.28.csv",
              "output_current_master_reconciliation_v0_28/lineage_authority_matrix_v0.28.csv",
              "output_current_master_reconciliation_v0_28/freeze_plan_v0.28.csv",
              "output_current_master_reconciliation_v0_28/summary_v0.28.json",
              "output_current_master_reconciliation_v0_28/stage_checkpoint_v0.28.json",
              "WELT-SWING-CURRENT-Handoff-v0.28.md",
              "WELT-SWING-CURRENT-Handoff-CURRENT.md",
          }
          assert required.issubset(set(m["files"]))
          print("CURRENT_MASTER_UNIVERSE_RECONCILIATION_FREEZE_PLAN_V0_28_WORKFLOW_GATES_PASS")
          PY

      - name: Ergebnisse und Current Handoff committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output_current_master_reconciliation_v0_28 \
            WELT-SWING-CURRENT-Handoff-v0.28.md \
            WELT-SWING-CURRENT-Handoff-CURRENT.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Reconcile current master universe and freeze plan v0.28"
            git push
          fi

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: current-master-universe-reconciliation-v0.28
          path: |
            output_current_master_reconciliation_v0_28/
            WELT-SWING-CURRENT-Handoff-v0.28.md
            WELT-SWING-CURRENT-Handoff-CURRENT.md
