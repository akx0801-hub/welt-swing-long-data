name: BR IBrX100 Sector Identity Coverage v0.64

on:
  push:
    branches: [main]
    paths:
      - config/br_ibrx100_sector_identity_coverage_v0.64.json

permissions:
  contents: write
  actions: read

jobs:
  br-sector-identity-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded v0.64 gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.64 lineage and bounded scope
        run: |
          set -euo pipefail
          START="f0a67388740b17dd62b47f1163df76d503a9c50b"
          git merge-base --is-ancestor "$START" HEAD
          BAD="$(git diff --name-only "$START"..HEAD | grep -Ev '^(config/manager_governance_authority_G_SEC_03_v0\.64\.json|config/br_ibrx100_sector_identity_coverage_research_v0\.64\.json|scripts/br_ibrx100_sector_identity_coverage_v0_64\.py|scripts/persist_br_ibrx100_sector_identity_coverage_v0_64\.py|tests/test_br_ibrx100_sector_identity_coverage_v0_64\.py|\.github/workflows/br_ibrx100_sector_identity_coverage_v0\.64\.yml|config/br_ibrx100_sector_identity_coverage_v0\.64\.json)$' || true)"
          test -z "$BAD"

      - name: Verify exact v0.63 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10911387342 --jq .digest)"
          test "$DIGEST" = "sha256:0ec10e147c619ec999af1b8de3dcd34b93d4fff29c3f6a96dd672bcb05446535"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open("output_br_ibrx100_b3_sector_bulk_route_v0_63/summary_v0.63.json",encoding="utf-8"))
          c=json.load(open("output_br_ibrx100_b3_sector_bulk_route_v0_63/stage_checkpoint_v0.63.json",encoding="utf-8"))
          d=json.load(open("output_br_ibrx100_b3_sector_bulk_route_v0_63/br_b3_sector_bulk_route_discovery_v0.63.json",encoding="utf-8"))
          assert s["verdict"]=="BLOCKED_SOURCE_NATIVE_SECTOR_CODE"
          assert s["br_official_sector_bulk_route_ready"] is True
          assert s["access_class"]=="PUBLIC_REPRODUCIBLE"
          assert s["classification_content"]=="PASS"
          assert d["resolved_route_id"]=="B3_LISTED_COMPANIES_CLASSIFICATION_SEARCH"
          assert d["taxonomy_identity"]=="B3_CLASSIFICACAO_SETORIAL"
          assert s["sector_code"]=="NOT_AVAILABLE"
          assert c["workflow_run_id"]==36258067350 and c["artifact_id"]==10911387342
          assert "sha256:"+c["artifact_digest"]=="sha256:0ec10e147c619ec999af1b8de3dcd34b93d4fff29c3f6a96dd672bcb05446535"
          assert s["mapping_population_runs"]==0 and s["other_cohort_rechecks"]==0
          assert s["sector_rs_runs"]==0 and s["p0_runs"]==s["p1_runs"]==s["p2_runs"]==0
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          PY

      - name: Verify G-SEC-03 and v0.64 research contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          a=json.load(open("config/manager_governance_authority_G_SEC_03_v0.64.json",encoding="utf-8"))
          r=json.load(open("config/br_ibrx100_sector_identity_coverage_research_v0.64.json",encoding="utf-8"))
          t=json.load(open("config/br_ibrx100_sector_identity_coverage_v0.64.json",encoding="utf-8"))
          assert a["authority_id"]=="G-SEC-03" and a["version"]=="v0.64"
          assert a["source_code_absent_values"]["Sector_Code_Method"]=="PDSC_SHA256_V1"
          assert a["br_binding"]["Sector_Taxonomy"]=="B3_CLASSIFICACAO_SETORIAL"
          assert a["br_binding"]["Sector_Level"]=="SETOR_ECONOMICO"
          assert a["rules"]["canonical_mapping_population_authorized"] is False
          assert a["rules"]["sector_rs_authorized"] is False
          assert r["scope_cohort"]=="BR_IBRX100" and r["frozen_rows"]==37
          assert r["exact_37_result"]["ready"]==0
          assert r["exact_37_result"]["not_verified"]==37
          assert r["exact_37_result"]["blocker"]=="BR_EXACT_37_COVERAGE_INCOMPLETE"
          assert all(v==0 for v in r["prohibited_requests"].values())
          assert t["required_start_head"]=="f0a67388740b17dd62b47f1163df76d503a9c50b"
          assert t["scope_cohort"]=="BR_IBRX100"
          assert t["manager_governance_authority"]=="G-SEC-03"
          assert t["alpha_vantage_allowed"] is False
          assert t["canonical_mapping_population_allowed"] is False
          assert t["other_cohorts_allowed"] is False
          assert t["sector_rs_allowed"] is False
          assert t["p0_allowed"] is False
          assert t["productive"] is False
          PY

      - name: Compile and test
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/br_ibrx100_sector_identity_coverage_v0_64.py scripts/persist_br_ibrx100_sector_identity_coverage_v0_64.py
          python3 tests/test_br_ibrx100_sector_identity_coverage_v0_64.py -v

      - name: Run bounded v0.64 gate
        run: |
          set -euo pipefail
          rm -rf output_br_ibrx100_sector_identity_coverage_v0_64
          python3 scripts/br_ibrx100_sector_identity_coverage_v0_64.py             --repository-sha "$GITHUB_SHA"             --output-dir output_br_ibrx100_sector_identity_coverage_v0_64

      - name: Validate exact-37 fail-closed result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,hashlib,re
          from pathlib import Path
          out=Path("output_br_ibrx100_sector_identity_coverage_v0_64")
          s=json.load(open(out/"summary_preupload_v0.64.json",encoding="utf-8"))
          level=json.load(open(out/"br_b3_sector_level_binding_v0.64.json",encoding="utf-8"))
          col=json.load(open(out/"canonical_sector_code_collision_audit_v0.64.json",encoding="utf-8"))
          ident=list(csv.DictReader(open(out/"br_security_company_identity_audit_v0.64.csv",encoding="utf-8")))
          cov=list(csv.DictReader(open(out/"br_exact_37_coverage_audit_v0.64.csv",encoding="utf-8")))
          det=list(csv.DictReader(open(out/"canonical_sector_code_determinism_test_v0.64.csv",encoding="utf-8")))
          tests=list(csv.DictReader(open(out/"test_results_v0.64.csv",encoding="utf-8")))

          assert s["verdict"]=="BLOCKED_EXACT_37_CLASSIFICATION_COVERAGE"
          assert s["br_sector_identity_coverage_ready"] is False
          assert (s["ready"],s["total"],s["ambiguous"],s["not_found"],s["not_verified"])==(0,37,0,0,37)
          assert s["sector_code_method"]=="PDSC_SHA256_V1"
          assert s["security_to_company_ready"]==37
          assert s["blocker"]=="BR_EXACT_37_COVERAGE_INCOMPLETE"
          assert len(ident)==37 and all(r["Security_To_Company_Status"]=="PASS" for r in ident)
          assert all(r["Company_Name_Join_Used"]=="NO" for r in ident)
          assert len(cov)==37 and all(r["Coverage_Status"]=="NOT_VERIFIED" for r in cov)
          assert all(r["Sector_Code"]=="NOT_GENERATED_WITHOUT_VERIFIED_SECTOR_NAME" for r in cov)
          assert level["Sector_Level"]=="SETOR_ECONOMICO"
          assert level["Subsetor_Used"]=="NO" and level["Segmento_Used"]=="NO"
          assert len(det)>=1 and all(r["Deterministic"]=="PASS" for r in det)
          assert all(re.match(r"^PDSC1:[0-9a-f]{64}$",r["Generation_1"]) for r in det)
          assert col["result"]=="PASS" and col["collisions"]==0
          assert all(r["Result"]=="PASS" for r in tests)
          assert all(v==0 for v in s["prohibited_provider_calls"].values())
          assert s["canonical_mapping_population_runs"]==0
          assert s["sector_rs_runs"]==0 and s["other_cohort_rechecks"]==0
          assert s["p0_runs"]==s["p1_runs"]==s["p2_runs"]==0
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          PY
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Upload bounded v0.64 evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: br-ibrx100-sector-identity-coverage-v0.64-${{ github.run_id }}
          path: output_br_ibrx100_sector_identity_coverage_v0_64/
          if-no-files-found: error
          retention-days: 14

      - name: Bind artifact and prepare persistence
        run: |
          set -euo pipefail
          python3 scripts/persist_br_ibrx100_sector_identity_coverage_v0_64.py             --output-dir output_br_ibrx100_sector_identity_coverage_v0_64             --artifact-id "${{ steps.upload.outputs.artifact-id }}"             --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"             --artifact-name "br-ibrx100-sector-identity-coverage-v0.64-${{ github.run_id }}"             --workflow-run-id "${{ github.run_id }}"             --workflow-head-sha "$GITHUB_SHA"

      - name: Persist bounded v0.64 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/BR_IBRX100_Canonical_Sector_Key_Security_Identity_Exact_37_Coverage_v0.64.md                   output_br_ibrx100_sector_identity_coverage_v0_64/
          CHANGED="$(git diff --cached --name-only)"
          test -n "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(docs/validation/BR_IBRX100_Canonical_Sector_Key_Security_Identity_Exact_37_Coverage_v0\.64\.md|output_br_ibrx100_sector_identity_coverage_v0_64/)' ; then
            echo "Unexpected staged path"
            exit 1
          fi
          git commit -m "Persist BR IBrX100 identity coverage v0.64"
          git push origin HEAD:main
