name: Current Master Remaining Official Source Materialization v0.35
on:
  push:
    branches: [main]
    paths: [config/current_master_remaining_missing_segment_official_source_materialization_v0.35.json]
permissions: {contents: write}
jobs:
  v035r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Dependencies
        run: pip install requests beautifulsoup4 lxml pypdf
      - name: Compile
        run: python -m py_compile scripts/current_master_remaining_missing_segment_official_source_materialization_v0_35.py
      - name: Self-test
        run: python scripts/current_master_remaining_missing_segment_official_source_materialization_v0_35.py --self-test
      - name: Frozen input gates and real deep materialization
        run: python scripts/current_master_remaining_missing_segment_official_source_materialization_v0_35.py
      - name: Strong result gates
        run: |
          python - <<'PY'
          import csv,json
          o='output_current_master_remaining_source_materialization_v0_35/'
          p=list(csv.DictReader(open(o+'remaining_segment_official_endpoint_probe_v0.35.csv')))
          a=list(csv.DictReader(open(o+'official_candidate_asset_links_v0.35.csv')))
          s=list(csv.DictReader(open(o+'remaining_segment_materialization_status_v0.35.csv')))
          assert len(s)==6 and len(a)>6 and any(x['Source_Type']=='API' and x['Segment_ID']=='KR_KOSPI200' for x in p)
          assert any(x['Segment_ID']=='MX_IPC' and x['Direct_Asset']=='true' for x in p)
          assert all(x['Final_State_v0_35'] for x in s)
          x=json.load(open(o+'summary_v0.35.json'));assert x['current_master_rows']==1633 and x['revision']=='r2_real_deep_materialization'
          PY
          git diff --exit-code -- universe/Welt-Swing-Universe-Master-v2.0.xlsx universe/research_partial_1633.csv
      - name: Commit outputs and handoff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A output_current_master_remaining_source_materialization_v0_35 WELT-SWING-CURRENT-Handoff-v0.35.md WELT-SWING-CURRENT-Handoff-CURRENT.md
          git diff --cached --quiet || git commit -m 'v0.35-r2 real deep source materialization evidence'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: current-master-remaining-source-materialization-v0.35-r2
          path: output_current_master_remaining_source_materialization_v0_35
