name: BR IBrX100 Canonical Sector Metadata Materialization v0.68

on:
  push:
    branches: [main]
    paths:
      - config/br_ibrx100_canonical_sector_metadata_materialization_v0.68.json

permissions:
  contents: write
  actions: read

jobs:
  br-canonical-sector-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded v0.68 gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.68 lineage and bounded scope
        run: |
          set -euo pipefail
          START="f27a8be1cea6ed38b3fe92a1ca3a15a54de6fd89"
          git merge-base --is-ancestor "$START" HEAD
          BAD="$(git diff --name-only "$START"..HEAD | grep -Ev '^(config/manager_governance_authority_G_SEC_04_v0\.68\.json|config/br_ibrx100_canonical_sector_metadata_materialization_spec_v0\.68\.json|scripts/br_ibrx100_canonical_sector_metadata_materialization_v0_68\.py|scripts/persist_br_ibrx100_canonical_sector_metadata_materialization_v0_68\.py|tests/test_br_ibrx100_canonical_sector_metadata_materialization_v0_68\.py|\.github/workflows/br_ibrx100_canonical_sector_metadata_materialization_v0\.68\.yml|config/br_ibrx100_canonical_sector_metadata_materialization_v0\.68\.json)$' || true)"
          test -z "$BAD"

      - name: Verify exact v0.67 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10914754106 --jq .digest)"
          test "$DIGEST" = "sha256:84d16a51b33ec4ff29375017244f498ab844d4a8621ee56c3a4d1736d5af1510"
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          s=json.load(open("output_br_ibrx100_b3_classification_tree_execution_v0_67/summary_v0.67.json",encoding="utf-8"))
          c=json.load(open("output_br_ibrx100_b3_classification_tree_execution_v0_67/stage_checkpoint_v0.67.json",encoding="utf-8"))
          m=json.load(open("output_br_ibrx100_b3_classification_tree_execution_v0_67/manifest_v0.67.json",encoding="utf-8"))
          tree=json.load(open("output_br_ibrx100_b3_classification_tree_execution_v0_67/b3_execution_tree_snapshot_v0.67.json",encoding="utf-8"))
          cov=list(csv.DictReader(open("output_br_ibrx100_b3_classification_tree_execution_v0_67/br_exact_37_classification_coverage_v0.67.csv",encoding="utf-8")))
          assert s["verdict"]=="PASS_BR_EXACT_37_CLASSIFICATION_COVERAGE"
          assert s["br_exact_37_classification_coverage_ready"] is True
          assert (s["ready"],s["total"],s["ambiguous"],s["not_found"],s["not_verified"])==(37,37,0,0,0)
          assert (s["executed_group_queries"],s["expected_group_queries"],s["successful_group_queries"],s["failed_group_queries"])==(86,86,86,0)
          assert s["distinct_setores"]==10 and s["pdsc_collisions"]==0
          assert c["workflow_run_id"]==36270129434 and c["artifact_id"]==10914754106
          assert "sha256:"+c["artifact_digest"]=="sha256:84d16a51b33ec4ff29375017244f498ab844d4a8621ee56c3a4d1736d5af1510"
          assert m["artifact"]["artifact_verified"]=="PASS"
          assert tree["current_structural_sha256"]=="febe642ea5b713c7a8709d1bf314ea3bac84b6ccf21f155073bc315ffc0bd0bd"
          assert tree["second_structural_sha256"]=="febe642ea5b713c7a8709d1bf314ea3bac84b6ccf21f155073bc315ffc0bd0bd"
          assert tree["current_recursive_node_count"]==262 and tree["structurally_valid"] is True
          assert len(cov)==37 and all(r["Coverage_Status"]=="PROVABLY_MAPPABLE" for r in cov)
          assert s["sector_rs_runs"]==0 and s["p0_runs"]==s["p1_runs"]==s["p2_runs"]==0
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          PY

      - name: Verify G-SEC-04 and v0.68 spec
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          g=json.load(open("config/manager_governance_authority_G_SEC_04_v0.68.json",encoding="utf-8"))
          s=json.load(open("config/br_ibrx100_canonical_sector_metadata_materialization_spec_v0.68.json",encoding="utf-8"))
          t=json.load(open("config/br_ibrx100_canonical_sector_metadata_materialization_v0.68.json",encoding="utf-8"))
          assert g["authority_id"]=="G-SEC-04" and g["version"]=="v0.68"
          assert g["rules"]["cohort_promotion_requires_every_frozen_member_verified"] is True
          assert g["rules"]["partial_rows_inside_cohort_forbidden"] is True
          assert g["rules"]["unresolved_cohort_placeholder_rows_forbidden"] is True
          assert g["rules"]["sector_rs_authorized"] is False
          assert g["rules"]["external_reference_requests_authorized"] is False
          assert s["required_start_head"]=="f27a8be1cea6ed38b3fe92a1ca3a15a54de6fd89"
          assert s["scope_cohort"]=="BR_IBRX100" and s["frozen_rows"]==37
          assert s["expected_distinct_setores"]==10
          assert s["global_ready_after_success"]==37 and s["global_total"]==1425 and s["global_remaining_after_success"]==1388
          assert s["external_market_reference_requests_allowed"] is False
          assert s["b3_requests_allowed"] is False
          assert s["alpha_vantage_allowed"] is False
          assert s["sector_rs_allowed"] is False
          assert t["required_start_head"]=="f27a8be1cea6ed38b3fe92a1ca3a15a54de6fd89"
          assert t["scope_cohort"]=="BR_IBRX100"
          assert t["external_market_reference_requests_allowed"] is False
          assert t["b3_requests_allowed"] is False
          assert t["alpha_vantage_allowed"] is False
          assert t["sector_rs_allowed"] is False
          assert t["p0_allowed"] is False
          assert t["productive"] is False
          PY

      - name: Compile and unit-test
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/br_ibrx100_canonical_sector_metadata_materialization_v0_68.py             scripts/persist_br_ibrx100_canonical_sector_metadata_materialization_v0_68.py
          python3 tests/test_br_ibrx100_canonical_sector_metadata_materialization_v0_68.py -v

      - name: Materialize canonical BR cohort partition
        run: |
          set -euo pipefail
          rm -rf output_br_ibrx100_canonical_sector_metadata_materialization_v0_68
          rm -f sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv
          rm -f sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv
          python3 scripts/br_ibrx100_canonical_sector_metadata_materialization_v0_68.py             --repository-sha "$GITHUB_SHA"             --output-dir output_br_ibrx100_canonical_sector_metadata_materialization_v0_68

      - name: Validate canonical materialization and hard scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          out=Path("output_br_ibrx100_canonical_sector_metadata_materialization_v0_68")
          s=json.load(open(out/"summary_preupload_v0.68.json",encoding="utf-8"))
          gs=json.load(open(out/"global_sector_metadata_coverage_status_v0.68.json",encoding="utf-8"))
          ws=json.load(open(out/"br_canonical_ws_id_set_audit_v0.68.json",encoding="utf-8"))
          imm=json.load(open(out/"immutability_audit_v0.68.json",encoding="utf-8"))
          prov=json.load(open(out/"provider_call_audit_v0.68.json",encoding="utf-8"))
          sem=json.load(open(out/"semantic_hash_contract_v0.68.json",encoding="utf-8"))
          tests=list(csv.DictReader(open(out/"test_results_v0.68.csv",encoding="utf-8")))
          eq=list(csv.DictReader(open(out/"br_canonical_value_equality_audit_v0.68.csv",encoding="utf-8")))
          inv=list(csv.DictReader(open(out/"br_canonical_sector_inventory_v0.68.csv",encoding="utf-8")))

          assert all(r["Result"]=="PASS" for r in tests)
          assert all(v==0 for v in prov.values())
          assert s["external_market_reference_requests"]==0 and s["b3_requests"]==0 and s["alpha_vantage_requests"]==0
          assert s["sector_rs_runs"]==0 and s["p0_runs"]==s["p1_runs"]==s["p2_runs"]==0
          assert ws["Set_Equality"] is True
          assert ws["Frozen_BR_Row_Count"]==37 and ws["v067_READY_Row_Count"]==37 and ws["Canonical_Candidate_Row_Count"]==37
          assert ws["Canonical_Duplicates"]==0
          assert ws["Primary_MIC_BVMF_All"] is True
          assert len(eq)==37 and all(r["Value_Equality_Status"]=="PASS" and r["PDSC_Integrity_Status"]=="PASS" for r in eq)
          assert len(inv)==10 and all(r["Same_Sector_Name_Same_Code"]=="PASS" for r in inv)
          assert sem["fields_in_order"]==["WS_ID","Sector_Taxonomy","Sector_Level","Sector_Code","Sector_Name","Mapping_Status"]

          if s["br_canonical_sector_metadata_ready"]:
              assert s["verdict"]=="PASS_BR_CANONICAL_SECTOR_METADATA_MATERIALIZATION"
              assert (s["br_ready"],s["br_total"])==(37,37)
              assert (s["global_ready"],s["global_total"],s["global_remaining"])==(37,1425,1388)
              assert s["global_canonical_sector_metadata_ready"] is False
              assert s["distinct_setores"]==10
              assert s["duplicates"]==s["missing"]==s["extra"]==0
              assert s["value_mismatches"]==s["pdsc_mismatches"]==s["pdsc_collisions"]==s["provenance_failures"]==0
              assert s["semantic_sha256"] and len(s["semantic_sha256"])==64
              assert s["blocker"]==""
              canon=Path("sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv")
              reg=Path("sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv")
              rows=list(csv.DictReader(open(canon,encoding="utf-8")))
              regs=list(csv.DictReader(open(reg,encoding="utf-8")))
              assert len(rows)==37 and len({r["WS_ID"] for r in rows})==37
              assert all(r["Mapping_Status"]=="VERIFIED_CANONICAL" for r in rows)
              assert all(r["Primary_Universe_Index"]=="BR_IBRX100" and r["Primary_MIC"]=="BVMF" for r in rows)
              assert all(r["Sector_Taxonomy"]=="B3_CLASSIFICACAO_SETORIAL" and r["Sector_Level"]=="SETOR_ECONOMICO" for r in rows)
              assert all(r["Source_Sector_Code"]=="NULL" and r["Sector_Code_Origin"]=="PROJECT_DERIVED_CANONICAL" and r["Sector_Code_Method"]=="PDSC_SHA256_V1" for r in rows)
              assert all(r["Evidence_Version"]=="v0.67" and r["Evidence_Final_Commit"]=="f27a8be1cea6ed38b3fe92a1ca3a15a54de6fd89" for r in rows)
              assert all(r["Tree_Snapshot_SHA256"]=="febe642ea5b713c7a8709d1bf314ea3bac84b6ccf21f155073bc315ffc0bd0bd" for r in rows)
              assert all(r["Source_Effective_AsOf_Status"]=="NOT_PUBLISHED_IN_PERSISTED_V0.67_EVIDENCE" for r in rows)
              assert len(regs)==1 and regs[0]["Cohort"]=="BR_IBRX100" and regs[0]["Canonical_Status"]=="READY"
              assert regs[0]["Semantic_SHA256"]==s["semantic_sha256"]
              assert hashlib.sha256(canon.read_bytes()).hexdigest()==s["canonical_file_sha256"]
              evidence=out/"br_canonical_sector_metadata_materialization_v0.68.csv"
              assert canon.read_bytes()==evidence.read_bytes()
              assert gs["BR_CANONICAL_SECTOR_METADATA_READY"] is True
              assert gs["GLOBAL_CANONICAL_SECTOR_METADATA_READY"] is False
              assert (gs["GLOBAL_READY"],gs["GLOBAL_TOTAL"],gs["GLOBAL_REMAINING"])==(37,1425,1388)
          else:
              assert s["verdict"]=="BLOCKED_BR_CANONICAL_SECTOR_METADATA_MATERIALIZATION"
              assert s["blocker"]!=""
              assert not Path("sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv").exists()

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          assert imm["Sector_RS_Runs"]==0 and imm["P0_Runs"]==imm["P1_Runs"]==imm["P2_Runs"]==0
          PY
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Upload bounded v0.68 evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: br-ibrx100-canonical-sector-metadata-v0.68-${{ github.run_id }}
          path: |
            output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/
            sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv
            sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv
          if-no-files-found: error
          retention-days: 14

      - name: Bind artifact and prepare persistence
        run: |
          set -euo pipefail
          python3 scripts/persist_br_ibrx100_canonical_sector_metadata_materialization_v0_68.py             --output-dir output_br_ibrx100_canonical_sector_metadata_materialization_v0_68             --artifact-id "${{ steps.upload.outputs.artifact-id }}"             --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"             --artifact-name "br-ibrx100-canonical-sector-metadata-v0.68-${{ github.run_id }}"             --workflow-run-id "${{ github.run_id }}"             --workflow-head-sha "$GITHUB_SHA"

      - name: Persist bounded v0.68 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/BR_IBRX100_Canonical_Sector_Metadata_Mapping_Materialization_v0.68.md                   output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/
          if [ -f sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv ]; then
            git add sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv
          fi
          if [ -f sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv ]; then
            git add sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv
          fi
          CHANGED="$(git diff --cached --name-only)"
          test -n "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(docs/validation/BR_IBRX100_Canonical_Sector_Metadata_Mapping_Materialization_v0\.68\.md|output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/.*|sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1\.csv|sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1\.csv)$' ; then
            echo "Unexpected staged path"
            exit 1
          fi
          git commit -m "Persist BR IBrX100 canonical sector metadata v0.68"
          git push origin HEAD:main
