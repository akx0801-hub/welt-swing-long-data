name: Frozen 1425 Canonical Sector Reconciliation v0.69

on:
  push:
    branches: [main]
    paths:
      - config/frozen_1425_canonical_sector_reconciliation_v0.69.json

permissions:
  contents: write
  actions: read

jobs:
  canonical-sector-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded v0.69 gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.69 lineage and bounded scope
        run: |
          set -euo pipefail
          START="978404e766f7813819686835adf2254cd5071c62"
          git merge-base --is-ancestor "$START" HEAD
          BAD="$(git diff --name-only "$START"..HEAD | grep -Ev '^(config/frozen_1425_canonical_sector_reconciliation_spec_v0\.69\.json|scripts/frozen_1425_canonical_sector_reconciliation_v0_69\.py|scripts/persist_frozen_1425_canonical_sector_reconciliation_v0_69\.py|tests/test_frozen_1425_canonical_sector_reconciliation_v0_69\.py|\.github/workflows/frozen_1425_canonical_sector_reconciliation_v0\.69\.yml|config/frozen_1425_canonical_sector_reconciliation_v0\.69\.json)$' || true)"
          test -z "$BAD"

      - name: Verify exact v0.68 predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10916176386 --jq .digest)"
          test "$DIGEST" = "sha256:e3acc96caff5715a5e09d123b3183137a0f84097afb1315b7c523a75d3f24e77"
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          s=json.load(open("output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/summary_v0.68.json",encoding="utf-8"))
          c=json.load(open("output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/stage_checkpoint_v0.68.json",encoding="utf-8"))
          g=json.load(open("output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/global_sector_metadata_coverage_status_v0.68.json",encoding="utf-8"))
          reg=list(csv.DictReader(open("sector_metadata/canonical/canonical_sector_metadata_cohort_registry_v1.csv",encoding="utf-8")))
          assert s["verdict"]=="PASS_BR_CANONICAL_SECTOR_METADATA_MATERIALIZATION"
          assert s["br_canonical_sector_metadata_ready"] is True
          assert (s["br_ready"],s["br_total"])==(37,37)
          assert (s["global_ready"],s["global_total"],s["global_remaining"])==(37,1425,1388)
          assert s["semantic_sha256"]=="bd975af67f46d6961f50480fe3eea391bd807d6c65c1a376717fbd0c07d19aed"
          assert s["canonical_file_sha256"]=="83706c76baba6d9a4fcc557d170f0bcad6fd85c9ca90fbc9f062cd5765dcef28"
          assert c["workflow_run_id"]==36271957458 and c["artifact_id"]==10916176386
          assert "sha256:"+c["artifact_digest"]=="sha256:e3acc96caff5715a5e09d123b3183137a0f84097afb1315b7c523a75d3f24e77"
          assert g["GLOBAL_CANONICAL_SECTOR_METADATA_READY"] is False
          assert (g["GLOBAL_READY"],g["GLOBAL_TOTAL"],g["GLOBAL_REMAINING"])==(37,1425,1388)
          assert len(reg)==1 and reg[0]["Cohort"]=="BR_IBRX100" and reg[0]["Canonical_Status"]=="READY"
          assert reg[0]["Semantic_SHA256"]=="bd975af67f46d6961f50480fe3eea391bd807d6c65c1a376717fbd0c07d19aed"
          assert reg[0]["Canonical_File_SHA256"]=="83706c76baba6d9a4fcc557d170f0bcad6fd85c9ca90fbc9f062cd5765dcef28"
          assert s["sector_rs_runs"]==0 and s["p0_runs"]==s["p1_runs"]==s["p2_runs"]==0
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv")=="83706c76baba6d9a4fcc557d170f0bcad6fd85c9ca90fbc9f062cd5765dcef28"
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          PY

      - name: Verify repository authority inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          counts={
            "AU_SP_ASX200":63,"BR_IBRX100":37,"CN_CSI300":294,"IN_NIFTY50":45,
            "JP_N225":197,"TW_TW50":49,"US_SP400":368,"US_SP500":372
          }
          s62=json.load(open("output_frozen_1425_source_native_sector_coverage_v0_62/summary_v0.62.json",encoding="utf-8"))
          led=list(csv.DictReader(open("output_frozen_1425_source_native_sector_coverage_v0_62/cohort_sector_source_route_ledger_v0.62.csv",encoding="utf-8")))
          g2=json.load(open("config/manager_governance_authority_G_SEC_02_v0.62.json",encoding="utf-8"))
          g3=json.load(open("config/manager_governance_authority_G_SEC_03_v0.64.json",encoding="utf-8"))
          g4=json.load(open("output_br_ibrx100_canonical_sector_metadata_materialization_v0_68/manager_governance_authority_G_SEC_04_v0.68.json",encoding="utf-8"))
          spec=json.load(open("config/frozen_1425_canonical_sector_reconciliation_spec_v0.69.json",encoding="utf-8"))
          trig=json.load(open("config/frozen_1425_canonical_sector_reconciliation_v0.69.json",encoding="utf-8"))
          assert s62["cohort_counts"]==counts and sum(counts.values())==1425
          assert len(led)==8 and {r["Cohort"] for r in led}==set(counts)
          assert g2["authority_id"]=="G-SEC-02"
          assert g3["authority_id"]=="G-SEC-03"
          assert g3["rules"]["canonical_method_when_native_code_absent"]=="PDSC_SHA256_V1"
          assert g3["rules"]["classification_inference_forbidden"] is True
          assert g4["authority_id"]=="G-SEC-04"
          assert g4["rules"]["sector_rs_authorized"] is False
          assert spec["required_start_head"]=="978404e766f7813819686835adf2254cd5071c62"
          assert spec["external_requests_allowed"] is False
          assert spec["provider_calls_allowed"] is False
          assert spec["mapping_population_allowed"] is False
          assert spec["sector_rs_allowed"] is False
          assert spec["canonical_materialization_allowed"] is False
          assert spec["other_cohort_execution_allowed"] is False
          assert spec["alpha_vantage_allowed"] is False
          assert trig["required_start_head"]=="978404e766f7813819686835adf2254cd5071c62"
          assert trig["external_requests_allowed"] is False
          assert trig["mapping_population_allowed"] is False
          assert trig["sector_rs_allowed"] is False
          assert trig["p0_allowed"] is False
          assert trig["productive"] is False
          PY

      - name: Compile and unit-test
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/frozen_1425_canonical_sector_reconciliation_v0_69.py             scripts/persist_frozen_1425_canonical_sector_reconciliation_v0_69.py
          python3 tests/test_frozen_1425_canonical_sector_reconciliation_v0_69.py -v

      - name: Run authority reconciliation
        run: |
          set -euo pipefail
          rm -rf output_frozen_1425_canonical_sector_reconciliation_v0_69
          python3 scripts/frozen_1425_canonical_sector_reconciliation_v0_69.py             --repository-sha "$GITHUB_SHA"             --output-dir output_frozen_1425_canonical_sector_reconciliation_v0_69

      - name: Validate deterministic selection and immutability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          out=Path("output_frozen_1425_canonical_sector_reconciliation_v0_69")
          s=json.load(open(out/"summary_preupload_v0.69.json",encoding="utf-8"))
          rec=json.load(open(out/"canonical_sector_metadata_global_reconciliation_v0.69.json",encoding="utf-8"))
          sel=json.load(open(out/"selected_next_cohort_authority_v0.69.json",encoding="utf-8"))
          reg=json.load(open(out/"canonical_registry_integrity_audit_v0.69.json",encoding="utf-8"))
          glob=json.load(open(out/"global_coverage_integrity_audit_v0.69.json",encoding="utf-8"))
          prov=json.load(open(out/"provider_call_audit_v0.69.json",encoding="utf-8"))
          imm=json.load(open(out/"immutability_audit_v0.69.json",encoding="utf-8"))
          matrix=list(csv.DictReader(open(out/"current_authority_cohort_gate_matrix_v0.69.csv",encoding="utf-8")))
          depth=list(csv.DictReader(open(out/"unresolved_cohort_gate_depth_v0.69.csv",encoding="utf-8")))
          calc=list(csv.DictReader(open(out/"next_cohort_selection_calculation_v0.69.csv",encoding="utf-8")))
          g3=list(csv.DictReader(open(out/"g_sec_03_cross_cohort_applicability_audit_v0.69.csv",encoding="utf-8")))
          tests=list(csv.DictReader(open(out/"test_results_v0.69.csv",encoding="utf-8")))

          assert s["verdict"]=="PASS_CANONICAL_SECTOR_METADATA_RECONCILIATION_NEXT_COHORT_SELECTED"
          assert s["global_canonical_sector_metadata_ready"] is False
          assert (s["global_ready"],s["global_total"],s["global_remaining"])==(37,1425,1388)
          assert s["unresolved_cohorts"]==7 and len(matrix)==7
          assert "BR_IBRX100" not in {r["Cohort"] for r in matrix}
          assert s["selected_next_cohort"]=="IN_NIFTY50"
          assert s["resolved_gates_before_blocker"]==4
          assert s["earliest_unresolved_gate"]=="E"
          assert s["current_blocker"]=="DETERMINISTIC_WS_ID_LINKAGE_NOT_VERIFIED"
          assert s["next_gate"]=="IN_NIFTY50 DETERMINISTIC SECURITY IDENTITY LINKAGE GATE"
          assert sel["Selected_Next_Cohort"]=="IN_NIFTY50"
          assert sel["Resolved_Gates_Before_Blocker"]==4
          assert sel["Earliest_Unresolved_Gate"]=="E"
          assert sum(r["Selected"]=="YES" for r in calc)==1
          assert next(r for r in calc if r["Selected"]=="YES")["Cohort"]=="IN_NIFTY50"
          jp=next(r for r in matrix if r["Cohort"]=="JP_N225")
          assert jp["D"]=="NOT_VERIFIED"
          assert jp["Consecutive_Resolved_Gates"]=="3"
          assert next(r for r in g3 if r["Cohort"]=="JP_N225")["G_SEC_03_Applicability"]=="NOT_VERIFIED"
          assert {r["Cohort"]:int(r["Consecutive_Resolved_Gates"]) for r in depth}["IN_NIFTY50"]==4
          assert {r["Cohort"]:int(r["Consecutive_Resolved_Gates"]) for r in depth}["US_SP400"]==4
          assert {r["Cohort"]:int(r["Consecutive_Resolved_Gates"]) for r in depth}["US_SP500"]==4
          assert reg["integrity_status"]=="PASS"
          assert glob["Canonical_Promoted_Rows"]==37 and glob["No_Ready_Count_Increase"] is True
          assert all(v==0 for v in prov.values())
          assert all(r["Result"]=="PASS" for r in tests)
          assert imm["Canonical_READY_Rows_Before"]==imm["Canonical_READY_Rows_After"]==37
          assert imm["Canonical_Mapping_Population_Runs"]==0
          assert imm["Sector_RS_Runs"]==0
          assert imm["P0_Runs"]==imm["P1_Runs"]==imm["P2_Runs"]==0
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha("sector_metadata/canonical/cohorts/BR_IBRX100_sector_metadata_v1.csv")=="83706c76baba6d9a4fcc557d170f0bcad6fd85c9ca90fbc9f062cd5765dcef28"
          assert sha("universe/SWING_U3K_FROZEN_v0.5.csv")=="54b7a7dacf95b832176c2069ca11c787ce47bed522e2153caf2607bc52804ceb"
          assert sha("output_p0_frozen_1425_local_feature_implementation_v0_57/feature_materialization_v0.57.csv")=="177cff93408fe4c00c45ed4c9772f2a88321f6d8df43b6e67216c3f383834be9"
          assert sha("output_p0_frozen_1425_home_market_rs_v0_58/home_market_rs_materialization_v0.58.csv")=="2fef5b0ce4d030008282f9421f818d42dae6bc8d39c20d21a336ce998622fd32"
          PY
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Upload bounded v0.69 evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: frozen-1425-canonical-sector-reconciliation-v0.69-${{ github.run_id }}
          path: output_frozen_1425_canonical_sector_reconciliation_v0_69/
          if-no-files-found: error
          retention-days: 14

      - name: Bind artifact and prepare persistence
        run: |
          set -euo pipefail
          python3 scripts/persist_frozen_1425_canonical_sector_reconciliation_v0_69.py             --output-dir output_frozen_1425_canonical_sector_reconciliation_v0_69             --artifact-id "${{ steps.upload.outputs.artifact-id }}"             --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"             --artifact-name "frozen-1425-canonical-sector-reconciliation-v0.69-${{ github.run_id }}"             --workflow-run-id "${{ github.run_id }}"             --workflow-head-sha "$GITHUB_SHA"

      - name: Persist bounded v0.69 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/FROZEN_1425_Canonical_Sector_Metadata_Coverage_Reconciliation_Next_Cohort_Selection_v0.69.md                   output_frozen_1425_canonical_sector_reconciliation_v0_69/
          CHANGED="$(git diff --cached --name-only)"
          test -n "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(docs/validation/FROZEN_1425_Canonical_Sector_Metadata_Coverage_Reconciliation_Next_Cohort_Selection_v0\.69\.md|output_frozen_1425_canonical_sector_reconciliation_v0_69/.*)$' ; then
            echo "Unexpected staged path"
            exit 1
          fi
          git commit -m "Persist canonical sector reconciliation v0.69"
          git push origin HEAD:main
