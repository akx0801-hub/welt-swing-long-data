name: Current Master Research Partial 1633 Controlled Data Gap Remediation v0.40

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-master-research-partial-1633-controlled-data-gap-remediation-v0.40
  cancel-in-progress: false

jobs:
  controlled-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependency Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance==1.6.0" pandas numpy scipy

      - name: Restore frozen v0.38 source cache
        id: source-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: runtime_cache/v0_38/current_master_1633_market_prices.sqlite
          key: current-master-1633-v0.38-v0.40-source-readonly
          restore-keys: |
            current-master-1633-v0.38-

      - name: py_compile
        run: python -m py_compile scripts/current_master_research_partial_1633_controlled_data_gap_remediation_v0_40.py

      - name: Self-Test
        run: python scripts/current_master_research_partial_1633_controlled_data_gap_remediation_v0_40.py --self-test

      - name: Frozen Input and Target Scope Gates
        run: python scripts/current_master_research_partial_1633_controlled_data_gap_remediation_v0_40.py --validate-inputs

      - name: CONTROLLED_RETRY_DATA_ONLY
        run: python scripts/current_master_research_partial_1633_controlled_data_gap_remediation_v0_40.py --run

      - name: Strong Gates
        run: python scripts/current_master_research_partial_1633_controlled_data_gap_remediation_v0_40.py --strong-gates

      - name: Commit controlled remediation outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_current_master_research_partial_1633_controlled_data_gap_remediation_v0_40
          if git diff --cached --quiet; then
            echo "No controlled-remediation output changes to commit."
          else
            git commit -m "Complete v0.40 controlled data gap remediation"
            git push
          fi

      - name: Save v0.40 working cache
        uses: actions/cache/save@v4
        with:
          path: runtime_cache/v0_40/current_master_1633_controlled_remediation.sqlite
          key: current-master-1633-v0.40-controlled-remediation-${{ github.run_id }}

      - name: Artifact Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-master-1633-v0.40-controlled-data-gap-remediation
          path: output_current_master_research_partial_1633_controlled_data_gap_remediation_v0_40/
          if-no-files-found: warn
