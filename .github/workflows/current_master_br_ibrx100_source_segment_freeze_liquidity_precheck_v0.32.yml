name: Welt-Swing BR IBrX100 Source Freeze and Liquidity Precheck v0.32

on:
  workflow_dispatch:
  push:
    paths:
      - "config/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0.32.json"

permissions:
  contents: write
  actions: read

jobs:
  br_ibrx100_source_freeze_liquidity_precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Benötigte Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: py_compile
        run: |
          python -m py_compile scripts/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0_32.py

      - name: Self-Test
        run: |
          python scripts/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0_32.py --self-test

      - name: Frozen-Input-Gates
        shell: bash
        run: |
          set -euo pipefail
          check_blob () {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            echo "$path -> $actual"
            test "$actual" = "$expected"
          }

          check_blob "docs/spec/WELT-SWING-LONG-DEV-v0.1-MASTER-2026-08-23.md" "680d0434e534d1fe136e694ca05cb574958a1a24"
          check_blob "output_current_master_membership_identity_reconciliation_v0_31/summary_v0.31.json" "666f34eefe98758cf74192d0d58007dc0992ca4e"
          check_blob "output_current_master_membership_identity_reconciliation_v0_31/stage_checkpoint_v0.31.json" "87dcca405b2a0dbbc7b1ad240e3d5ba61e39b2d1"
          check_blob "output_current_master_membership_identity_reconciliation_v0_31/br_ibrx100_identity_reconciliation_v0.31.csv" "aeb03d77ae80818312cbeb70e2643bae1f521fde"
          check_blob "output_current_master_membership_identity_reconciliation_v0_31/br_ibrx100_strict_ordinary_candidates_v0.31.csv" "92420932bf9c50ddc304442c03315003ac2a7b11"
          check_blob "output_current_master_membership_identity_reconciliation_v0_31/br_ibrx100_instrument_exclusions_v0.31.csv" "36bb83c56ed3ada1fab0d3c02179188abfdec227"
          check_blob "output_current_master_source_deep_materialization_v0_30/b3_ibrx100_official_raw_v0.30.json" "efd5a73e52a9e3e54788fcad01efdd05222a23a0"
          check_blob "WELT-SWING-CURRENT-Handoff-CURRENT.md" "0f1c03957b00d704a4b2f408d813846b6cbbe269"

      - name: v0.32 ausführen
        run: |
          python scripts/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0_32.py             --config config/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0.32.json

      - name: Ergebnis-Gates
        run: |
          python scripts/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0_32.py             --config config/current_master_br_ibrx100_source_segment_freeze_liquidity_precheck_v0.32.json             --validate

      - name: Outputs committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             output_current_master_br_ibrx100_liquidity_v0_32             universe/segments/br_ibrx100_source_frozen_v0.32.csv             universe/segments/br_ibrx100_strict_ordinary_frozen_v0.32.csv             WELT-SWING-CURRENT-Handoff-v0.32.md             WELT-SWING-CURRENT-Handoff-CURRENT.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Freeze B3 IBrX100 source and run liquidity precheck v0.32"
            git push
          fi

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: current-master-br-ibrx100-liquidity-v0.32
          path: |
            output_current_master_br_ibrx100_liquidity_v0_32/
            universe/segments/br_ibrx100_source_frozen_v0.32.csv
            universe/segments/br_ibrx100_strict_ordinary_frozen_v0.32.csv
            WELT-SWING-CURRENT-Handoff-v0.32.md
            WELT-SWING-CURRENT-Handoff-CURRENT.md
