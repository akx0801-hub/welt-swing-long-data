name: Welt-Swing JSE ISIN Bulk Probe v0.11

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/instrument_resolution_jse_probe_v0.11.json'

permissions:
  contents: write

jobs:
  probe_jse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Offline-Selbsttest
        run: python scripts/probe_jse_isin_bulk_v0_11.py --self-test

      - name: Frozen-v0.10-Input-Gates
        shell: bash
        run: |
          test -f output_instrument_resolution_v0_10/summary_v0.10.json
          test -f output_instrument_resolution_v0_10/instrument_manual_review_queue_v0.10.csv
          test -f output_instrument_resolution_v0_10/strict_u3k_candidate_after_instrument_v0.10.csv

          test "$(git hash-object output_instrument_resolution_v0_10/summary_v0.10.json)" = "68f33acfe21ca659514c94b3335b9f81fd5eb931"
          test "$(git hash-object output_instrument_resolution_v0_10/instrument_manual_review_queue_v0.10.csv)" = "4a2f08620df7ea710ae72725955298819aabb18b"
          test "$(git hash-object output_instrument_resolution_v0_10/strict_u3k_candidate_after_instrument_v0.10.csv)" = "ee30df5638fa0564bbde0dfb7feead4e198bdc9a"

          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          s = json.loads(Path('output_instrument_resolution_v0_10/summary_v0.10.json').read_text(encoding='utf-8'))
          q = pd.read_csv('output_instrument_resolution_v0_10/instrument_manual_review_queue_v0.10.csv',
                          keep_default_na=False, dtype=str)

          assert s['schema'] == 'WELT_SWING_INSTRUMENT_RESOLUTION_KRX_V0_10'
          assert s['run_status'] == 'INSTRUMENT_RESOLUTION_KRX_V0_10_COMPLETE_WITH_SOURCE_BLOCK'
          assert s['remaining_manual_rows_v0_10'] == 667
          assert s['strict_candidates_v0_10'] == 2020
          assert s['krx_http_status'] == 400
          assert s['krx_pass_rows'] == 0
          assert s['krx_fail_rows'] == 0
          assert s['p0_run'] is False
          assert s['alpha_vantage_allowed'] is False
          assert len(q) == 667
          assert (q['Primary_Universe_Index'] == 'ZA_TOP40').sum() == 17
          print('JSE_ISIN_BULK_PROBE_V0_11_INPUT_GATE_PASS')
          PY

      - name: JSE ISIN Bulk-Quelle prüfen
        run: |
          python scripts/probe_jse_isin_bulk_v0_11.py \
            --config config/instrument_resolution_jse_probe_v0.11.json

      - name: Ergebnis-Gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          x = json.loads(Path('output_instrument_resolution_v0_11/summary_v0.11.json').read_text(encoding='utf-8'))
          print(json.dumps(x, indent=2, ensure_ascii=False))

          assert x['schema'] == 'WELT_SWING_JSE_ISIN_BULK_PROBE_V0_11'
          assert x['run_status'] in {
              'JSE_ISIN_BULK_PROBE_V0_11_COMPLETE_WITH_EVIDENCE',
              'JSE_ISIN_BULK_PROBE_V0_11_COMPLETE_WITH_SOURCE_BLOCK',
          }
          assert x['source_manual_rows_v0_10'] == 667
          assert x['za_target_rows'] == 17
          assert x['strict_candidates_v0_10'] == 2020
          assert x['strict_candidates_v0_11'] == 2020
          assert x['remaining_manual_rows_v0_11'] == 667
          assert x['decisions_changed'] == 0
          assert 1 <= x['external_reference_requests'] <= 2
          assert x['max_external_reference_requests'] == 2
          assert x['request_bound_respected'] is True
          assert x['strict_freeze_allowed'] is False
          assert x['p0_run'] is False
          assert x['productive_trading_authority'] is False
          assert x['alpha_vantage_allowed'] is False
          assert x['price_downloads_performed'] is False
          assert x['fx_downloads_performed'] is False
          assert x['web_calls_per_security'] is False
          assert x['canonical_master_mutated'] is False

          q = pd.read_csv('output_instrument_resolution_v0_11/instrument_manual_review_queue_v0.11.csv',
                          keep_default_na=False, dtype=str)
          assert len(q) == 667
          print('JSE_ISIN_BULK_PROBE_V0_11_RESULT_GATES_PASS')
          PY

      - name: Ergebnisse committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_instrument_resolution_v0_11/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Probe JSE equities ISIN bulk source v0.11"
            git push
          fi

      - name: Audit-Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-swing-jse-isin-bulk-probe-v0.11-${{ github.run_number }}
          path: output_instrument_resolution_v0_11/
          retention-days: 14
